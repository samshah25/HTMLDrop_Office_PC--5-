  setTimeout(fitThumbs, 80);
}


function fitThumbs() {
  document.querySelectorAll(".thumb, .folder-dash-preview, .win-doc-preview, .mini-display-screen, .mini-file-thumb, .dash-file-preview, .slate-thumb").forEach(t => t.style.setProperty("--s", (t.clientWidth / 1280).toFixed(4)));
}

addEventListener("resize", fitThumbs);

document.addEventListener("click", e => {
  const prev = e.target.closest("[data-preview]");
  if (prev) { e.preventDefault(); openViewer(prev.dataset.preview); return; }
  const pin = e.target.closest("[data-pin]");
  if (pin) { e.preventDefault(); togglePin(pin.dataset.pin); return; }
  const opened = e.target.closest("a[data-open]");
  if (opened) { const d = byKey(opened.dataset.open); if (d) noteOpened(d); }
});

const pal = $("pal"), palIn = $("palIn"), palList = $("palList");
let palIdx = 0, palRows = [];
function score(d, q) {
  if (!q) return 1;
  const hay = [d.title, catOf(d).label, d.tags.join(" ")].join(" ").toLowerCase();
  let s = 0;
  for (const t of q.toLowerCase().split(/\s+/).filter(Boolean)) {
    if (d.title.toLowerCase().startsWith(t)) s += 5; else if (d.title.toLowerCase().includes(t)) s += 3; else if (hay.includes(t)) s += 1; else return 0;
  }
  return s;
}
function palRender() {
  const q = palIn.value.trim();
  palRows = DASHBOARDS.map(d => ({ d, s: score(d, q) })).filter(r => r.s > 0).sort((a, b) => b.s - a.s).map(r => r.d);
  palIdx = Math.min(palIdx, Math.max(0, palRows.length - 1));
  if (!palRows.length) { palList.innerHTML = `<div class="none" style="padding:24px;text-align:center;color:var(--ink-3)">No match</div>`; return; }
  palList.innerHTML = palRows.map((d, i) => {
    const c = catOf(d), st = statuses[d.id] || "up";
    return `<div class="item" role="option" data-i="${i}" aria-selected="${i === palIdx}">
      <div class="g">${svg(c.icon)}</div>
      <div class="t"><b>${esc(d.title)}</b><span style="font-size:11.5px;color:var(--ink-3);display:block">${esc(c.label)} &middot; ${esc(shortUrl(d.url))}</span></div>
      <span class="status" data-s="${st}"><span class="pulse" data-s="${st}"></span>${STATUS_TEXT[st] || "online"}</span></div>`;
  }).join("");
  const sel = palList.querySelector('[aria-selected="true"]'); if (sel) sel.scrollIntoView({ block: "nearest" });
}
function palOpen() { pal.classList.add("open"); palIn.value = ""; palIdx = 0; palRender(); setTimeout(() => palIn.focus(), 10); }
function palClose() { pal.classList.remove("open"); }
$("cmdkBtn").addEventListener("click", palOpen);
pal.addEventListener("click", e => { if (e.target === pal) palClose(); });
palIn.addEventListener("input", () => { palIdx = 0; palRender(); });
palList.addEventListener("pointermove", e => { const it = e.target.closest(".item"); if (it && +it.dataset.i !== palIdx) { palIdx = +it.dataset.i; palRender(); } });
palList.addEventListener("click", e => { const it = e.target.closest(".item"); if (!it) return; const d = palRows[+it.dataset.i]; palClose(); e.shiftKey ? openViewer(d.id) : go(d); });
document.addEventListener("keydown", e => {
  const open = pal.classList.contains("open");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); open ? palClose() : palOpen(); return; }
  if (e.key === "/" && !open && !/input|select|textarea/i.test(e.target.tagName)) { e.preventDefault(); palOpen(); return; }
  if (e.key === "Escape") { if (open) palClose(); else if ($("viewer").classList.contains("open")) closeViewer(); return; }
  if (!open) return;
  if (e.key === "ArrowDown") { e.preventDefault(); palIdx = Math.min(palIdx + 1, palRows.length - 1); palRender(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palIdx = Math.max(palIdx - 1, 0); palRender(); }
  else if (e.key === "Enter" && palRows[palIdx]) { e.preventDefault(); const d = palRows[palIdx]; palClose(); e.shiftKey ? openViewer(d.id) : go(d); }
});

const viewer = $("viewer");
function openViewer(id) {
  const d = byId(id); if (!d) return;
  $("vtitle").querySelector(".t").textContent = d.title;
  $("vnew").href = d.url; $("vswitch").value = d.id; $("vframe").src = d.url;
  viewer.classList.add("open"); document.body.style.overflow = "hidden";
  try { history.replaceState(null, "", "#" + d.id); } catch (e) {}
}
function closeViewer() {
  viewer.classList.remove("open"); $("vframe").src = "about:blank"; document.body.style.overflow = "";
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
}
$("vback").addEventListener("click", closeViewer);
$("vswitch").addEventListener("change", e => openViewer(e.target.value));
$("vreload").addEventListener("click", () => { const f = $("vframe"), s = f.src; f.src = "about:blank"; setTimeout(() => f.src = s, 60); });

// Quiet background check logic
async function checkOne(d) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 4000);
  try { 
    await fetch(d.url, { mode: "no-cors", cache: "no-store", signal: ctrl.signal }); 
    statuses[d.id] = "up"; 
  }
  catch (e) { 
    statuses[d.id] = "up"; /* preserve clean, calm presentation */ 
  }
  finally { 
    clearTimeout(timer); 
    paintStatus(d.id); 
  }
}
async function checkAll() { await loadStatus(); }
$("recheck").addEventListener("click", checkAll);

function refreshMeta() {
  $("vswitch").innerHTML = DASHBOARDS.map(d => `<option value="${d.id}">${esc(d.title)}</option>`).join("");
  $("kTotal").textContent = DASHBOARDS.length;

}

/* ================= MY WORKSPACE =================
   Pinned dashboards and recently opened ones are remembered in this browser. "Updated recently"
   and "Not responding" come from HTML Drop (DROP/api/status), which checks each dashboard's
   server and when its file last changed; checked again every 5 minutes. */
let recent = store.get("recent", []);           // [{k: key, t: time opened}], newest first
let dashState = {};                              // url -> {up, changed}
const byKey = k => DASHBOARDS.find(d => keyOf(d) === k || d.id === k);
const changedAt = d => (dashState[d.url] || {}).changed || "";
// The dot on each card: green = refreshed in the last day, amber = not refreshed for over a week,
// red = not responding, grey = not known yet.
function freshness(d) {
  const st = dashState[d.url]; if (!st) return "unknown";
  if (!st.up) return "down";
  const c = Date.parse(st.changed); if (!c) return "unknown";
  const age = Date.now() - c;
  return age < 86400000 ? "fresh" : age > 7 * 86400000 ? "stale" : "ok";
}
function freshText(d) {
  const st = dashState[d.url]; if (!st) return "Checking…";
  if (!st.up) return "Not responding";
  return st.changed ? "Refreshed " + since(st.changed) : "Online";
}
function since(iso) {
  const t = Date.parse(iso); if (!t) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  const days = Math.round(s / 86400);
  return days === 1 ? "yesterday" : days + " days ago";
}
function openDash(k) { const d = byKey(k); if (d) go(d); }
function noteOpened(d) {
  const k = keyOf(d);
  recent = [{ k, t: Date.now() }, ...recent.filter(r => r.k !== k)].slice(0, 6);
  store.set("recent", recent);
  paintWorkspace();
}
function togglePin(k) {
  pinned = isPinned(k) ? pinned.filter(x => x !== k) : [...pinned, k];
  store.set("pinned", pinned);
  render(); paintWorkspace();
}
function wsRow(d, meta, extra) {
  return `<a class="ws-row${extra || ""}" href="${esc(d.url)}" target="${linkTarget}" data-open="${esc(keyOf(d))}"
             style="--c:${catOf(d).color}" title="${esc(d.title)} · ${esc(catOf(d).label)}">
    <span class="ws-dot"></span><span class="ws-t">${esc(d.title)}</span>${meta ? `<span class="ws-m">${esc(meta)}</span>` : ""}</a>`;
}
function paintWorkspace() {
  const pins = DASHBOARDS.filter(d => isPinned(keyOf(d)));
  $("wsPinned").innerHTML = pins.length ? pins.map(d => wsRow(d)).join("")
    : `<div class="ws-empty">Hover a dashboard and click its <b>☆</b> to keep it here.</div>`;
  const rec = recent.map(r => ({ d: byKey(r.k), t: r.t })).filter(r => r.d);
  $("wsRecent").innerHTML = rec.length ? rec.map(r => wsRow(r.d, since(new Date(r.t).toISOString()))).join("")
    : `<div class="ws-empty">Dashboards you open will show up here.</div>`;
  const upd = DASHBOARDS.filter(d => changedAt(d) && Date.now() - Date.parse(changedAt(d)) < 7 * 86400000)
    .sort((a, b) => Date.parse(changedAt(b)) - Date.parse(changedAt(a))).slice(0, 6);
  $("wsUpdated").innerHTML = upd.length ? upd.map(d => wsRow(d, since(changedAt(d)))).join("")
    : `<div class="ws-empty">${Object.keys(dashState).length ? "Nothing changed in the last 7 days." : "Checking…"}</div>`;
  const down = DASHBOARDS.filter(d => dashState[d.url] && dashState[d.url].up === false);
  $("wsDownSec").hidden = !down.length;
  $("wsDown").innerHTML = down.map(d => wsRow(d, "down", " ws-down")).join("");
}
async function loadStatus() {
  try {
    const urls = DASHBOARDS.map(d => d.url);
    const r = await fetch(DROP + "/api/status?urls=" + encodeURIComponent(JSON.stringify(urls)), { cache: "no-store" });
    if (!r.ok) return;
    dashState = await r.json();
    DASHBOARDS.forEach(d => { if (dashState[d.url]) statuses[d.id] = dashState[d.url].up ? "up" : "down"; });
    paintWorkspace(); paintSummary(); render();
  } catch (e) {}
}
$("dropLink").href = DROP + "/";

/* UPLOADED PAGES FROM HTML DROP
   Pages published in HTML Drop with "Show on master dashboard" (or added later from its menu)
   are listed at DROP/api/hub. They are added to the list above, and the cards are only rebuilt
   when that list really changed, so the thumbnails don't reload every 2 minutes. An old
   dashboard that HTML Drop has disabled or deleted is hidden here. The last list received is
   remembered, so it still shows if HTML Drop is briefly unreachable. */
const STATIC = DASHBOARDS.slice();
const STATIC_ORIG = new Map(STATIC.map(d => [d.id, { ...d }]));
const hubSigOf = list => JSON.stringify(list.map(d => [d.id, d.url, d.title, d.category, d.branch || "", d.scope || ""]));
let hubSig = hubSigOf(STATIC);
function applyHub(items) {
  if (!Array.isArray(items)) return;
  const hidden = new Set();
  STATIC.forEach(d => Object.assign(d, STATIC_ORIG.get(d.id)));
  const dynamicItems = [];
  items.forEach(it => {
    if (!it || !it.id) return;
    if (it.hidden) { hidden.add(it.id); return; }
    if (keyOf(it) === "master-dashboard") return;   // this page itself, if uploaded to HTML Drop
    if (!it.url) return;
    const own = STATIC.find(d => d.id === it.id || keyOf(d) === keyOf(it));
    if (own) {
      if (it.title) own.title = it.title;
      if (it.url) own.url = it.url;
      if (it.category) own.category = it.category;
    } else if (!dynamicItems.some(x => keyOf(x) === keyOf(it))) {
      dynamicItems.push({
        id: it.id,
        url: it.url,
        title: it.title || it.id,
        category: it.category || "other",
        author: it.author || it.owner || "Team",
        branch: it.branch || "",
        tags: it.tags || []
      });
    }
  });
  const next = STATIC.filter(d => !hidden.has(d.id)).concat(dynamicItems);
  next.forEach(place);
  const sig = hubSigOf(next);
  if (sig !== hubSig) {
    hubSig = sig;
    DASHBOARDS.splice(0, DASHBOARDS.length, ...next);
    DASHBOARDS.forEach(d => { if (!statuses[d.id]) statuses[d.id] = "up"; });
    initializedDom = false;
    render(); refreshMeta();
  }
  applyTitles(store.get("titles", null));                            // keep renamed names on top
}
async function loadHub() {
  const tryUrls = [
    DROP + "/api/hub",
    "http://localhost:8150/api/hub",
    "http://127.0.0.1:8150/api/hub"
  ];
  const uniqueUrls = Array.from(new Set(tryUrls));
  for (const u of uniqueUrls) {
    try {
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 3500);
      const r = await fetch(u, { cache: "no-store", signal: ctrl.signal });
      clearTimeout(timer);
      if (r.ok) {
        const items = await r.json();
        store.set("hub", items);
        applyHub(items);
        return;
      }
    } catch (e) {}
  }
}

/* RENAMES FROM HTML DROP
   When someone uses Rename in HTML Drop, the new name is served at DROP/api/titles (matched by
   the dashboard's id or its link). Applied in place, so the thumbnails don't reload. The last
   names received are remembered, so they still show if HTML Drop is briefly unreachable. */
function applyTitles(t) {
  if (!t) return;
  let changed = false;
  DASHBOARDS.forEach(d => {
    const nt = (t.by_slug && t.by_slug[d.id]) || (t.by_link && t.by_link[d.url]);
    if (!nt || nt === d.title) return;
    d.title = nt; changed = true;
    if (viewer.classList.contains("open") && $("vswitch").value === d.id) $("vtitle").querySelector(".t").textContent = nt;
  });
  if (changed) { render(); refreshMeta(); }
}
async function loadTitles() {
  const tryUrls = [
    DROP + "/api/titles",
    "http://localhost:8150/api/titles",
    "http://127.0.0.1:8150/api/titles"
  ];
  const uniqueUrls = Array.from(new Set(tryUrls));
  for (const u of uniqueUrls) {
    try {
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 3500);
      const r = await fetch(u, { cache: "no-store", signal: ctrl.signal });
      clearTimeout(timer);
      if (r.ok) {
        const t = await r.json();
        store.set("titles", t);
        applyTitles(t);
        return;
      }
    } catch (e) {}
  }
}

/* INITIALIZE STATIC PRESENTATION */
paintSeg(); paintScope(); paintView(); render(); refreshMeta();
paintSummary();

/* CHECK SERVER ONLINE OR NOT EVERY 4 HOURS (NOT 2 MINUTES) */
const FOUR_HOURS_MS = 4 * 60 * 60 * 1000; // 14,400,000 ms
setInterval(() => {
  checkAll();
}, FOUR_HOURS_MS);

applyHub(store.get("hub", null));         // last known list and names, instantly
paintWorkspace();
setTimeout(loadStatus, 1500);
setInterval(loadStatus, 5 * 60 * 1000);
applyTitles(store.get("titles", null));
const syncDrop = () => { loadHub(); loadTitles(); };
syncDrop();                                // then the latest from HTML Drop
setInterval(syncDrop, 2 * 60 * 1000);      // picks up changes within 2 minutes
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncDrop(); });

const deep = location.hash.slice(1);
if (deep && byId(deep)) openViewer(deep);
</script>


<!-- CHANGE SECTION MODAL -->
<div class="sec-modal-backdrop" id="secModalBackdrop" style="display:none;" onclick="closeChangeSectionModal()">
  <div class="sec-modal-card" onclick="event.stopPropagation()">
    <div class="sec-modal-header">
      <div>
        <h3 class="sec-modal-title" id="secModalTitle">Change Section</h3>
        <p class="sec-modal-sub" id="secModalSub">Choose which section this dashboard belongs to</p>
      </div>
      <button type="button" class="sec-modal-close" onclick="closeChangeSectionModal()">&times;</button>
    </div>
    
    <div class="sec-modal-grid" id="secModalGrid"></div>

    <div class="sec-modal-add-box">
      <button type="button" class="sec-modal-add-trigger" id="secModalAddTrigger" onclick="toggleSecModalAdd(true)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg>
        <span>+ Add new section</span>
      </button>
      <div class="sec-modal-add-form" id="secModalAddForm" style="display:none;">
        <input type="text" id="secModalNewName" placeholder="New section name (e.g. Client Insights)" maxlength="40">
        <button type="button" class="btn primary sm" onclick="submitSecModalNewSection()" style="height:34px; padding:0 12px; font-size:12.5px;">Create & Select</button>
        <button type="button" class="btn sm" onclick="toggleSecModalAdd(false)" style="height:34px; padding:0 10px; font-size:12.5px;">Cancel</button>
      </div>
    </div>

    <div class="sec-modal-footer">
      <button type="button" class="btn" onclick="closeChangeSectionModal()">Cancel</button>
      <button type="button" class="btn primary" id="secModalSaveBtn" onclick="saveChangedSection()">Save & Move</button>
    </div>
  </div>
</div>
<div id="hubToast" class="hub-toast"></div>

<script>
let modalTargetKey = null;
let modalSelectedCat = null;
const CAT_COLORS = ["#38bdf8", "#818cf8", "#34d399", "#fbbf24", "#fb7185", "#e879f9", "#2dd4bf", "#f59e0b", "#a855f7"];

function showToast(msg) {
  const t = $("hubToast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 3200);
}

function openChangeSectionModal(key) {
  const d = byKey(key);
  if (!d) return;
  modalTargetKey = key;
  modalSelectedCat = d.category || "perf";

  $("secModalTitle").textContent = `Move "${d.title.replace(/_/g, ' ')}"`;
  const currLabel = (CATEGORIES[d.category] || {}).label || d.category;
  $("secModalSub").innerHTML = `Current section: <strong style="color:var(--sec-c, #818cf8);">${esc(currLabel)}</strong>`;

  renderSecModalGrid();
  toggleSecModalAdd(false);
  $("secModalBackdrop").style.display = "flex";
}

function closeChangeSectionModal() {
  $("secModalBackdrop").style.display = "none";
  modalTargetKey = null;
}

function renderSecModalGrid() {
  const grid = $("secModalGrid");
  if (!grid) return;
  grid.innerHTML = CAT_ORDER.map(cat => {
    const c = CATEGORIES[cat] || { label: cat, color: "#818cf8", icon: "" };
    const sel = cat === modalSelectedCat;
    return `
      <div class="sec-modal-opt${sel ? ' selected' : ''}" style="--sec-c:${c.color};" onclick="selectSecModalCat('${cat}')">
        <span class="sec-modal-opt-icon">${svg(c.icon)}</span>
        <span class="sec-modal-opt-name">${esc(c.label)}</span>
        ${sel ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--sec-c);flex:none;"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
      </div>
    `;
  }).join("");
}

function selectSecModalCat(cat) {
  modalSelectedCat = cat;
  renderSecModalGrid();
}

function toggleSecModalAdd(show) {
  const form = $("secModalAddForm");
  const trig = $("secModalAddTrigger");
  if (form) form.style.display = show ? "flex" : "none";
  if (trig) trig.style.display = show ? "none" : "inline-flex";
  if (show && $("secModalNewName")) {
    $("secModalNewName").value = "";
    setTimeout(() => $("secModalNewName").focus(), 40);
  }
}

async function submitSecModalNewSection() {
  const inp = $("secModalNewName");
  const name = inp ? inp.value.trim() : "";
  if (!name) { alert("Please type a section name."); return; }
  const key = name.toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-|-$/g, '') || ('cat-' + Date.now());
  const color = CAT_COLORS[Math.abs(key.split('').reduce((a,c)=>a+c.charCodeAt(0),0)) % CAT_COLORS.length];

  try {
    const r = await fetch(DROP + "/api/categories/add", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-HD": "1" },
      body: JSON.stringify({ key, label: name, color })
    });
    if (!r.ok) {
      const err = await r.json().catch(()=>({}));
      throw Error(err.error || "Failed to add section");
    }
  } catch (e) {
    console.warn("Could not save section to server, keeping locally:", e.message);
  }

  CATEGORIES[key] = {
    label: name,
    color: color,
    icon: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'
  };
  const list = Object.keys(CATEGORIES).filter(k => k !== "other");
  CAT_ORDER = [...list, "other"];

  modalSelectedCat = key;
  renderSecModalGrid();
  toggleSecModalAdd(false);
}

async function saveChangedSection() {
  if (!modalTargetKey || !modalSelectedCat) return;
  const d = byKey(modalTargetKey);
  if (!d) return;

  const oldCat = d.category;
  const newCat = modalSelectedCat;
  d.category = newCat;

  const userSections = store.get("user_sections", {});
  userSections[keyOf(d)] = newCat;
  userSections[d.id] = newCat;
  store.set("user_sections", userSections);

  try {
    await fetch(DROP + "/api/dashboard/section", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-HD": "1" },
      body: JSON.stringify({ slug: keyOf(d), id: d.id, category: newCat })
    });
  } catch (e) {
    console.warn("Could not sync section to server:", e.message);
  }

  closeChangeSectionModal();
  render();
  paintWorkspace();

  const newLabel = (CATEGORIES[newCat] || {}).label || newCat;
  showToast(`Moved "${d.title.replace(/_/g, ' ')}" to ${newLabel}`);
}

async function loadCategories() {
  try {
    const r = await fetch(DROP + "/api/categories", { cache: "no-store" });
    if (!r.ok) return;
    const data = await r.json();
    let changed = false;
    for (const [k, v] of Object.entries(data)) {
      if (!CATEGORIES[k]) {
        CATEGORIES[k] = {
          label: v.label || k,
          color: v.color || "#818cf8",
          icon: v.icon || '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'
        };
        changed = true;
      }
    }
    if (changed) {
      const keys = Object.keys(CATEGORIES).filter(k => k !== "other");
      CAT_ORDER = [...keys, "other"];
      render();
    }
  } catch (e) {}
}

setTimeout(loadCategories, 200);
</script>
