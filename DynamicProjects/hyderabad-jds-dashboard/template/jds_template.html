<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem('hydjds.color-scheme') ?? 'light dark'; } catch (e) {}
</script>
<title>Hyderabad JDS — Category Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bg: light-dark(#f4f6f4, #0a1014);
  --surface: light-dark(#ffffff, #111a20);
  --surface-2: light-dark(#f0f4f2, #17232b);
  --line: light-dark(#dce3df, #24343f);
  --ink: light-dark(#0f1d1c, #e9f1f0);
  --ink-2: light-dark(#3b4f4d, #a5bab8);
  --ink-3: light-dark(#647876, #6f8785);
  --accent: light-dark(#0f766e, #2dd4bf);
  --accent-solid: #0f766e;
  --accent-soft: light-dark(#e6f6f3, #112d2c);
  --amber: light-dark(#d97706, #fbbf24);
  --grid: light-dark(#e9efec, #1b2932);
  --axis: light-dark(#c5d1cc, #334855);
  --good: #10b981;
  --good-ink: light-dark(#047857, #34d399);
  --good-bg: light-dark(#e6f8f1, #0e2e24);
  --bad: #ef4444;
  --bad-ink: light-dark(#b91c1c, #f87171);
  --bad-bg: light-dark(#feeceb, #3a171a);
  --flat-bg: light-dark(#eef2f0, #1d2b33);
  --shadow: light-dark(0 1px 2px rgba(15,29,28,.05), 0 8px 24px -12px rgba(15,29,28,.12), 0 2px 12px rgba(0,0,0,.35));
}
:root:has(> head > meta[name="color-scheme"][content="dark"]) { color-scheme: dark; }
:root:has(> head > meta[name="color-scheme"][content="light"]) { color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }

/* ---------- Top Navigation Bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(100deg, #0b2c2a 0%, #0f3d3a 55%, #134e4a 100%);
  color: #e6f4f1;
  border-bottom: 1px solid rgba(255,255,255,.1);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 11px;
  background: linear-gradient(135deg, #f59e0b, #ea580c);
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .4px;
  box-shadow: 0 6px 16px -4px rgba(245,158,11,.55);
}
.brand-txt b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -.2px; color: #fff; line-height: 1.15; }
.brand-txt span { font-size: 11px; color: #99d5cc; font-weight: 500; }
.nav-tabs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.nav-tab {
  border: 0; background: transparent; color: #b7e2dc;
  padding: 7px 14px; border-radius: 10px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: background .15s, color .15s;
}
.nav-tab:hover { background: rgba(255,255,255,.1); color: #fff; }
.nav-tab[aria-current="page"] {
  background: rgba(255,255,255,.18); color: #fff;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
}
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.stamp {
  font-size: 11.5px; color: #b7e2dc; background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.14); border-radius: 99px;
  padding: 4px 11px; white-space: nowrap;
}
.stamp::before {
  content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: #34d399; margin-right: 6px; vertical-align: 1px;
}
.theme-btn {
  width: 34px; height: 34px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
  color: #fff; display: grid; place-items: center; cursor: pointer;
}
.theme-btn:hover { background: rgba(255,255,255,.18); }
.theme-btn .ic-sun, .theme-btn .ic-moon { width: 17px; height: 17px; }
.theme-btn .ic-sun { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not(:has(> head > meta[name="color-scheme"][content="light"])) .theme-btn .ic-sun { display: block; }
  :root:not(:has(> head > meta[name="color-scheme"][content="light"])) .theme-btn .ic-moon { display: none; }
}
:root:has(> head > meta[name="color-scheme"][content="dark"]) .theme-btn .ic-sun { display: block; }
:root:has(> head > meta[name="color-scheme"][content="dark"]) .theme-btn .ic-moon { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- Filter Ribbon ---------- */
.ribbon {
  position: sticky; top: 57px; z-index: 15;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 10px 24px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
}
.seg {
  display: inline-flex; align-items: center;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 2px; gap: 2px;
}
.seg button {
  border: 0; background: none; color: var(--ink-2);
  padding: 4px 10px; border-radius: 8px; cursor: pointer;
  font-size: 12.5px; font-weight: 600; white-space: nowrap; transition: all .12s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--accent-solid); color: #fff;
  box-shadow: 0 2px 8px -2px rgba(15,118,110,.55);
}
select.ctl {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 5px 10px; font-size: 12.5px; font-weight: 600;
  color: var(--ink); cursor: pointer;
}
.reset-btn {
  margin-left: auto; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink-2); border-radius: 9px; padding: 5px 10px;
  font-size: 12px; font-weight: 600; cursor: pointer;
}
.reset-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- Page Canvas ---------- */
.wrap { max-width: 1460px; margin: 0 auto; padding: 20px 24px 64px; }

/* ---------- Hero Banner ---------- */
.hero {
  background: linear-gradient(125deg, #0d3b38 0%, #0f6b64 58%, #b45309 100%);
  color: #fff; border-radius: 20px; padding: 22px 26px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px;
  margin-bottom: 18px; box-shadow: 0 18px 36px -22px rgba(13,59,56,.75);
  position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; right: -70px; top: -110px; width: 300px; height: 300px;
  border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.16), transparent 70%); pointer-events: none;
}
.hero-meta { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .88; }
.hero h1 { margin: 4px 0 0; font-size: 25px; font-weight: 800; letter-spacing: -.4px; }
.h-kpis { display: flex; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }
.hk {
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2);
  backdrop-filter: blur(6px); border-radius: 14px; padding: 10px 15px; min-width: 138px;
}
.hk b { display: block; font-size: 21px; font-weight: 800; line-height: 1.15; }
.hk span { display: block; font-size: 11.5px; font-weight: 600; opacity: .92; margin-top: 2px; }
.hk em { display: block; font-style: normal; font-size: 11px; opacity: .82; margin-top: 2px; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow);
}
.card + .card { margin-top: 16px; }
.c-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
}
.c-head h2 { margin: 0; font-size: 15.5px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.c-head h2 .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.c-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ---------- SVG Charts ---------- */
.chart-leg { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.chart-leg span { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.chart-leg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { font-family: var(--font); fill: var(--ink-3); font-size: 11px; }
svg.chart text.lbl-strong { fill: var(--ink); font-weight: 700; }
svg.chart rect.hit { fill: transparent; cursor: pointer; }
svg.chart rect.hit:hover { fill: color-mix(in srgb, var(--accent) 8%, transparent); }

/* ---------- Responsive Tables (modern-web-guidance: responsive-table) ---------- */
.tbl-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.tbl-bar-l { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.search-box {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 5px 10px;
}
.search-box input { border: 0; background: transparent; outline: none; width: 210px; font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 10px; padding: 6px 12px;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent-solid); border-color: var(--accent-solid); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); color: #fff; }

.table-wrapper {
  overflow: auto;
  max-inline-size: 100%;
  max-block-size: min(640px, 78vh);
  container-type: inline-size;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
.table-wrapper.no-cap { max-block-size: none; }
.table-wrapper table {
  width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px;
}
.table-wrapper thead {
  position: sticky; inset-block-start: 0; z-index: 2;
  background: var(--surface-2);
}
.table-wrapper th {
  text-align: left; padding: 9px 11px; font-size: 11.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
.table-wrapper th.sort { cursor: pointer; user-select: none; }
.table-wrapper th.sort:hover { color: var(--ink); }
.table-wrapper th.num, .table-wrapper td.num { text-align: right; }
.table-wrapper td, .table-wrapper tbody th {
  padding: 8px 11px; border-bottom: 1px solid var(--line); white-space: nowrap;
  font-weight: 500;
}
.table-wrapper tbody th {
  position: sticky; inset-inline-start: 0; z-index: 1;
  background: var(--surface); text-align: left; font-weight: 700;
  color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 13px;
}
.table-wrapper tbody tr:hover td, .table-wrapper tbody tr:hover th {
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
}
.table-wrapper tr.sub-row td, .table-wrapper tr.sub-row th {
  background: var(--surface-2); font-size: 12.5px;
}
.table-wrapper tr.sub-row .sub-ind { padding-left: 26px; font-weight: 600; }
.table-wrapper tfoot td, .table-wrapper tfoot th {
  position: sticky; inset-block-end: 0; z-index: 2;
  background: var(--surface-2); border-top: 2px solid var(--line);
  font-weight: 800; padding: 9px 11px;
}
.link-btn {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--ink); font-weight: 700; text-align: left;
}
.link-btn:hover { color: var(--accent); text-decoration: underline; }
.exp-btn {
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--ink-2); border-radius: 7px; padding: 2px 7px;
  font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.exp-btn:hover { border-color: var(--accent); color: var(--accent); }
.exp-btn.open { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Matrix heatmap cell */
.mx-cell {
  border: 0; background: transparent; cursor: pointer;
  display: inline-flex; flex-direction: column; align-items: flex-end;
  padding: 3px 7px; border-radius: 7px; width: 100%; text-align: right;
  transition: transform .1s;
}
.mx-cell:hover { outline: 1.5px solid var(--accent); }
.mx-cell.up { background: var(--good-bg); }
.mx-cell.dn { background: var(--bad-bg); }
.mx-cell.up2 { background: color-mix(in srgb, var(--good) 26%, var(--surface)); }
.mx-cell.dn2 { background: color-mix(in srgb, var(--bad) 24%, var(--surface)); }
.mx-cell b { font-size: 12.5px; color: var(--ink); line-height: 1.2; }
.mx-cell small { font-size: 10.5px; font-weight: 700; line-height: 1.15; }

/* Inline driver tag */
.drv { font-size: 11.5px; white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }

@container (width < 600px) {
  .table-wrapper table, .table-wrapper thead, .table-wrapper tbody, .table-wrapper tfoot,
  .table-wrapper tr, .table-wrapper th, .table-wrapper td { display: block; }
  .table-wrapper thead { display: none; }
  .table-wrapper tr {
    margin-block-end: 10px; border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; background: var(--surface);
  }
  .table-wrapper tbody th {
    position: sticky; inset-block-start: 0; z-index: 2;
    background: var(--surface-2); border-bottom: 1px solid var(--line);
  }
  .table-wrapper td {
    display: flex; justify-content: space-between; align-items: center;
    text-align: right; white-space: normal; padding: 6px 12px;
  }
  .table-wrapper td[data-lbl]::before {
    content: attr(data-lbl); font-weight: 600; color: var(--ink-3);
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; margin-right: 12px; text-align: left;
  }
}

/* ---------- Pills, Colors & Helpers ---------- */
.pill { display: inline-flex; align-items: center; border-radius: 99px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; }
.pill.good { background: var(--good-bg); color: var(--good-ink); }
.pill.bad { background: var(--bad-bg); color: var(--bad-ink); }
.pill.flat { background: var(--flat-bg); color: var(--ink-3); }
.ok-t { color: var(--good-ink); font-weight: 700; }
.lo-t { color: var(--bad-ink); font-weight: 700; }
.muted { color: var(--ink-3); }
.emp-code { display: block; font-size: 11px; color: var(--ink-3); font-weight: 500; }
.note {
  margin-top: 16px; padding: 10px 14px; border-radius: 12px;
  border: 1px dashed var(--line); background: var(--surface);
  font-size: 12px; color: var(--ink-2);
}
.empty { padding: 28px; text-align: center; color: var(--ink-3); font-weight: 600; }

/* ---------- Native Modal Dialog (modern-web-guidance: light-dismiss-a-dialog) ---------- */
dialog#detailDlg {
  width: min(820px, calc(100vw - 24px));
  max-height: calc(100vh - 32px);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 0;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 28px 70px -16px rgba(0,0,0,.45);
  overflow: hidden;
}
dialog#detailDlg::backdrop {
  background: rgba(10, 16, 20, .55);
  backdrop-filter: blur(3px);
}
.dlg-head {
  background: linear-gradient(120deg, #0d3b38, #0f766e);
  color: #fff; padding: 16px 20px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.dlg-head.bad { background: linear-gradient(120deg, #7f1d1d, #dc2626); }
.dlg-head.good { background: linear-gradient(120deg, #065f46, #059669); }
.dlg-head h2 { margin: 2px 0 4px; font-size: 20px; font-weight: 800; }
.dlg-meta { font-size: 12px; opacity: .9; }
.dlg-x {
  border: 0; background: rgba(255,255,255,.18); color: #fff;
  width: 32px; height: 32px; border-radius: 10px; font-size: 16px; cursor: pointer; flex: none;
}
.dlg-x:hover { background: rgba(255,255,255,.3); }
.dlg-back {
  border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.15);
  color: #fff; border-radius: 8px; padding: 3px 9px; font-size: 11.5px; font-weight: 700;
  cursor: pointer; margin-bottom: 6px;
}
.dlg-body { padding: 16px 20px 22px; overflow-y: auto; max-height: calc(100vh - 140px); display: flex; flex-direction: column; gap: 14px; }
.dlg-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }

/* ---------- Tooltip ---------- */
#tip {
  position: fixed; z-index: 60; pointer-events: none;
  background: #0f1d1c; color: #f0f7f6;
  border: 1px solid rgba(255,255,255,.14); border-radius: 10px;
  padding: 8px 11px; font-size: 12px; line-height: 1.45; max-width: 320px;
  box-shadow: 0 14px 32px -10px rgba(0,0,0,.5); display: none;
}
#tip .tt-t { font-weight: 800; color: #5eead4; margin-bottom: 3px; }

@media (max-width: 680px) {
  .topbar, .ribbon, .wrap { padding-inline: 14px; }
  .ribbon { position: static; }
  .stamp { display: none; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">JDS</div>
    <div class="brand-txt">
      <b>Hyderabad JDS</b>
      <span>Category &amp; Sales Group Intelligence · YoY</span>
    </div>
  </div>
  <nav class="nav-tabs" aria-label="Dashboard sections">
    <button type="button" class="nav-tab" data-tab="categories">Categories</button>
    <button type="button" class="nav-tab" data-tab="salesgroups">Sales Groups</button>
    <button type="button" class="nav-tab" data-tab="seasonality">Seasonality</button>
    <button type="button" class="nav-tab" data-tab="geo">By Area</button>
    <button type="button" class="nav-tab" data-tab="matrix">By Channel</button>
    <button type="button" class="nav-tab" data-tab="people">Who Secured</button>
  </nav>
  <div class="top-right">
    <span class="stamp" id="dataStamp"></span>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="Toggle color theme" title="Switch light / dark theme">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="sr-only">Toggle color theme</span>
    </button>
  </div>
</header>

<div class="ribbon" id="ribbon"></div>
<main class="wrap" id="app"></main>

<dialog id="detailDlg" closedby="any" aria-labelledby="dlgTitle"></dialog>
<div id="tip" role="tooltip"></div>

<script type="application/json" id="jdsData">{}</script>
<script>
(() => {
'use strict';

const D = JSON.parse(document.getElementById('jdsData').textContent || '{}');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, dp = 0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('en-IN', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const fmtN = v => v == null || isNaN(v) ? '—' : nf(v, 0);
const fmtDelta = v => v == null || isNaN(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + fmtN(Math.abs(v));
const fmtYoy = (ty, ly) => ly > 0 ? (((ty - ly) / ly * 100) > 0 ? '+' : '') + nf((ty - ly) / ly * 100, 1) + '%' : (ty > 0 ? 'NEW' : '—');
const yoyRatio = (ty, ly) => ly > 0 ? (ty - ly) / ly : (ty > 0 ? Infinity : null);
const fmtRv = v => {
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  if (a >= 1e7) return sg + '₹' + nf(a / 1e7, 2) + ' Cr';
  if (a >= 1e5) return sg + '₹' + nf(a / 1e5, 1) + ' L';
  return sg + '₹' + nf(a, 0);
};
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fyMonIdx = m => m >= 4 ? m : m + 12;
const fyMonNum = fm => fm > 12 ? fm - 12 : fm;
const fyKeyLabel = k => (k % 100) + ' ' + MON[fyMonNum(Math.floor(k / 100)) - 1];
const niceMax = v => {
  if (!v || v <= 0) return 10;
  const p = 10 ** Math.floor(Math.log10(v)), n = v / p;
  return (n <= 1.2 ? 1.2 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
};
const verdict = (ty, ly) => {
  const d = ty - ly, p = ly > 0 ? d / ly : null;
  if ((p != null && p >= 0.05) || d >= 10 || (ly === 0 && ty >= 3)) return 'good';
  if ((p != null && p <= -0.05) || d <= -10 || (ty === 0 && ly >= 3)) return 'bad';
  return 'flat';
};
const vPill = v => v === 'good' ? '<span class="pill good">Good</span>' : v === 'bad' ? '<span class="pill bad">Bad</span>' : '<span class="pill flat">Flat</span>';
const wrapLbl = (name, maxLen = 13) => {
  if (name.length <= maxLen) return [name];
  const words = name.split(/\s+/), lines = [];
  let cur = '';
  for (const w of words) {
    if (cur && (cur + ' ' + w).length > maxLen) { lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  return lines.length <= 2 ? lines : [lines[0], lines.slice(1).join(' ').slice(0, maxLen - 1) + '…'];
};
const compactDiff = (ty, ly) => {
  const diff = ty - ly;
  const dStr = diff > 0 ? '+' + fmtN(diff) : (diff < 0 ? '−' + fmtN(-diff) : '0');
  if (ly > 0) {
    const p = Math.round((diff / ly) * 100);
    return `${dStr} (${p > 0 ? '+' : p < 0 ? '−' : ''}${Math.abs(p)}%)`;
  }
  return ty > 0 ? `${dStr} (New)` : '0';
};

// ---------- Filtering & Aggregation ----------
function monthsList() {
  const a = Math.floor(M.common_start_k / 100), b = Math.floor(M.common_end_k / 100);
  const out = [];
  for (let fm = a; fm <= b; fm++) out.push(fm);
  return out;
}
function activeWindow() {
  const sK = M.common_start_k, eK = M.common_end_k;
  const eFm = Math.floor(eK / 100), eDay = eK % 100;
  if (S.win === 'mtd') {
    const a = Math.max(sK, eFm * 100 + 1);
    return { a, b: eK, label: `MTD (${fyKeyLabel(a)} – ${fyKeyLabel(eK)})` };
  }
  if (S.win === 'qtd') {
    const qStart = 4 + Math.floor((eFm - 4) / 3) * 3;
    const a = Math.max(sK, qStart * 100 + 1);
    return { a, b: eK, label: `QTD (${fyKeyLabel(a)} – ${fyKeyLabel(eK)})` };
  }
  if (S.win === 'd30') {
    const endIso = `${fyMonNum(eFm) < 4 ? M.ty_year + 1 : M.ty_year}-${String(fyMonNum(eFm)).padStart(2, '0')}-${String(eDay).padStart(2, '0')}`;
    const d0 = new Date(endIso + 'T00:00:00'); d0.setDate(d0.getDate() - 29);
    const k0 = fyMonIdx(d0.getMonth() + 1) * 100 + d0.getDate();
    const a = Math.max(sK, k0);
    return { a, b: eK, label: `Last 30d (${fyKeyLabel(a)} – ${fyKeyLabel(eK)})` };
  }
  if (S.win === 'month' && S.month) {
    const fm = S.month;
    const a = Math.max(sK, fm * 100 + 1), b = Math.min(eK, fm * 100 + 31);
    const mn = MONTHS[fyMonNum(fm) - 1];
    const partial = (a % 100 !== 1) || (fm === eFm);
    return { a, b, label: partial ? `${mn} (${fyKeyLabel(a)} – ${fyKeyLabel(b)})` : mn };
  }
  return { a: sK, b: eK, label: `YTD (${fyKeyLabel(sK)} – ${fyKeyLabel(eK)})` };
}
function scopeOk(ai) {
  if (S.scope === 'all') return true;
  const a = D.areas[ai];
  if (!a) return false;
  if (S.scope === 'main') return a.main === 1;
  if (S.scope === 'remote') return a.main === 0;
  return a.state === S.scope;
}
function scopeLabel() {
  return { all: 'Whole Branch', main: 'Main City (Hyd)', remote: 'Remote (TS & AP)', TS: 'Telangana', AP: 'Andhra Pradesh' }[S.scope] || 'Whole Branch';
}
function empLabel(ei) {
  if (ei < 0 || !D.emps[ei]) return { code: '', name: 'Unassigned', label: 'Unassigned' };
  const [code, nm] = D.emps[ei];
  return { code, name: nm || '', label: nm || ('Emp ' + code) };
}

function aggregate() {
  const W = activeWindow();
  const nC = D.cats.length, nS = D.subcats.length, nCh = D.channels.length, nE = D.emps.length;
  const totLy = new Set(), totTy = new Set();
  let rvLy = 0, rvTy = 0;

  const chLy = Array.from({ length: nCh }, () => new Set()), chTy = Array.from({ length: nCh }, () => new Set());
  const chRvLy = new Float64Array(nCh), chRvTy = new Float64Array(nCh);

  const cLy = Array.from({ length: nC }, () => new Set()), cTy = Array.from({ length: nC }, () => new Set());
  const cRvLy = new Float64Array(nC), cRvTy = new Float64Array(nC);

  const sLy = Array.from({ length: nS }, () => new Set()), sTy = Array.from({ length: nS }, () => new Set());
  const sRvLy = new Float64Array(nS), sRvTy = new Float64Array(nS);
  const sChTy = Array.from({ length: nS }, () => new Map());

  // Category x Channel, Category x Month (full common range), and Category x Area matrices
  const mxLy = new Map(), mxTy = new Map();
  const cmLy = new Map(), cmTy = new Map();
  const caLy = new Map(), caTy = new Map();
  const aLy = Array.from({ length: D.areas.length }, () => new Set()), aTy = Array.from({ length: D.areas.length }, () => new Set());

  const roleIdx = S.peopleRole === 'me' ? 8 : 7;
  const eLy = Array.from({ length: nE }, () => new Set()), eTy = Array.from({ length: nE }, () => new Set());
  const eRvLy = new Float64Array(nE), eRvTy = new Float64Array(nE);
  const eChCnt = Array.from({ length: nE }, () => new Map());
  const eCats = Array.from({ length: nE }, () => new Map());

  const catOnlyFilter = (S.tab === 'salesgroups' || S.tab === 'people') ? S.catFilter : -1;

  for (const r of D.rows) {
    // [yr, mmdd, di, ai, si, chi, flags, tme_i, me_i, rv, coll]
    const [yr, k, di, ai, si, chi, flags, tmeI, meI, rv] = r;
    if (!scopeOk(ai)) continue;
    if (S.ch >= 0 && chi !== S.ch) continue;
    const fr = flags & 1;
    if (S.fresh !== 'all' && fr !== +S.fresh) continue;

    const ci = D.subcats[si][0];
    // Seasonality matrix spans full common_start_k..common_end_k regardless of selected tenure window
    if (k >= M.common_start_k && k <= M.common_end_k) {
      const cmk = ci + '|' + Math.floor(k / 100);
      const cmp = yr === 1 ? cmTy : cmLy;
      let cs = cmp.get(cmk); if (!cs) { cs = new Set(); cmp.set(cmk, cs); } cs.add(di);
    }
    if (k < W.a || k > W.b) continue;

    const mk = ci + '|' + chi;
    const ak = ci + '|' + ai;
    const ei = roleIdx === 8 ? meI : tmeI;

    if (yr === 1) {
      if (catOnlyFilter < 0 || ci === catOnlyFilter) {
        totTy.add(di); rvTy += rv;
      }
      chTy[chi].add(di); chRvTy[chi] += rv;
      cTy[ci].add(di); cRvTy[ci] += rv;
      sTy[si].add(di); sRvTy[si] += rv;
      sChTy[si].set(chi, (sChTy[si].get(chi) || 0) + 1);
      aTy[ai].add(di);
      let ms = mxTy.get(mk); if (!ms) { ms = new Set(); mxTy.set(mk, ms); } ms.add(di);
      let as = caTy.get(ak); if (!as) { as = new Set(); caTy.set(ak, as); } as.add(di);

      if (ei >= 0 && (catOnlyFilter < 0 || ci === catOnlyFilter)) {
        eTy[ei].add(di); eRvTy[ei] += rv;
        eChCnt[ei].set(chi, (eChCnt[ei].get(chi) || 0) + 1);
        let cv = eCats[ei].get(ci);
        if (!cv) { cv = { ly: new Set(), ty: new Set(), rvLy: 0, rvTy: 0 }; eCats[ei].set(ci, cv); }
        cv.ty.add(di); cv.rvTy += rv;
      }
    } else {
      if (catOnlyFilter < 0 || ci === catOnlyFilter) {
        totLy.add(di); rvLy += rv;
      }
      chLy[chi].add(di); chRvLy[chi] += rv;
      cLy[ci].add(di); cRvLy[ci] += rv;
      sLy[si].add(di); sRvLy[si] += rv;
      aLy[ai].add(di);
      let ms = mxLy.get(mk); if (!ms) { ms = new Set(); mxLy.set(mk, ms); } ms.add(di);
      let as = caLy.get(ak); if (!as) { as = new Set(); caLy.set(ak, as); } as.add(di);

      if (ei >= 0 && (catOnlyFilter < 0 || ci === catOnlyFilter)) {
        eLy[ei].add(di); eRvLy[ei] += rv;
        eChCnt[ei].set(chi, (eChCnt[ei].get(chi) || 0) + 1);
        let cv = eCats[ei].get(ci);
        if (!cv) { cv = { ly: new Set(), ty: new Set(), rvLy: 0, rvTy: 0 }; eCats[ei].set(ci, cv); }
        cv.ly.add(di); cv.rvLy += rv;
      }
    }
  }

  const subsByCat = Array.from({ length: nC }, () => []);
  const allSubs = [];
  for (let si = 0; si < nS; si++) {
    const [ci, name] = D.subcats[si];
    const ly = sLy[si].size, ty = sTy[si].size;
    if (!ly && !ty) continue;
    const topCh = [...sChTy[si].entries()].sort((a, b) => b[1] - a[1])[0];
    const item = {
      si, ci, catName: D.cats[ci], name, ly, ty, diff: ty - ly, yoy: yoyRatio(ty, ly),
      rvLy: sRvLy[si], rvTy: sRvTy[si], rvYoy: yoyRatio(sRvTy[si], sRvLy[si]),
      topCh: topCh ? D.channels[topCh[0]] : '—', verdict: verdict(ty, ly),
    };
    subsByCat[ci].push(item);
    allSubs.push(item);
  }
  subsByCat.forEach(l => l.sort((a, b) => b.ly - a.ly || b.ty - a.ty));

  const cats = [];
  for (let ci = 0; ci < nC; ci++) {
    const ly = cLy[ci].size, ty = cTy[ci].size;
    if (!ly && !ty) continue;
    const subs = subsByCat[ci];
    const topGain = [...subs].filter(x => x.diff > 0).sort((a, b) => b.diff - a.diff)[0] || null;
    const topDrop = [...subs].filter(x => x.diff < 0).sort((a, b) => a.diff - b.diff)[0] || null;
    cats.push({
      ci, name: D.cats[ci], ly, ty, diff: ty - ly, yoy: yoyRatio(ty, ly),
      rvLy: cRvLy[ci], rvTy: cRvTy[ci], rvYoy: yoyRatio(cRvTy[ci], cRvLy[ci]),
      verdict: verdict(ty, ly), subs, nSub: subs.length,
      subNames: subs.map(x => x.name).join(' '),
      topGain, topDrop,
    });
  }

  const channels = [];
  for (let i = 0; i < nCh; i++) {
    const ly = chLy[i].size, ty = chTy[i].size;
    if (!ly && !ty) continue;
    // Top gaining & dropping category inside this channel
    let bestC = null, worstC = null;
    for (const c of cats) {
      const mk = c.ci + '|' + i;
      const l = mxLy.get(mk) ? mxLy.get(mk).size : 0;
      const t = mxTy.get(mk) ? mxTy.get(mk).size : 0;
      const d = t - l;
      if (d > 0 && (!bestC || d > bestC.d)) bestC = { name: c.name, d };
      if (d < 0 && (!worstC || d < worstC.d)) worstC = { name: c.name, d };
    }
    channels.push({
      i, name: D.channels[i], ly, ty, diff: ty - ly, yoy: yoyRatio(ty, ly),
      rvLy: chRvLy[i], rvTy: chRvTy[i], rvYoy: yoyRatio(chRvTy[i], chRvLy[i]),
      verdict: verdict(ty, ly), bestC, worstC,
    });
  }

  const people = [];
  for (let ei = 0; ei < nE; ei++) {
    const ly = eLy[ei].size, ty = eTy[ei].size;
    if (!ly && !ty) continue;
    const info = empLabel(ei);
    const topCh = [...eChCnt[ei].entries()].sort((a, b) => b[1] - a[1])[0];
    const clist = [...eCats[ei].entries()].map(([ci, v]) => ({
      ci, name: D.cats[ci], ly: v.ly.size, ty: v.ty.size, diff: v.ty.size - v.ly.size,
      yoy: yoyRatio(v.ty.size, v.ly.size), rvLy: v.rvLy, rvTy: v.rvTy, verdict: verdict(v.ty.size, v.ly.size),
    })).sort((a, b) => b.ty - a.ty || b.ly - a.ly);
    const topCats = clist.filter(x => x.ty > 0).slice(0, 2).map(x => `${x.name} (${fmtN(x.ty)})`).join(', ')
      || clist.slice(0, 2).map(x => `${x.name} (${fmtN(x.ly)} LY)`).join(', ');
    people.push({
      ei, ...info, ch: topCh ? D.channels[topCh[0]] : '—',
      ly, ty, diff: ty - ly, yoy: yoyRatio(ty, ly),
      rvLy: eRvLy[ei], rvTy: eRvTy[ei], verdict: verdict(ty, ly),
      cats: clist, nCat: clist.length, topCats, catNames: clist.map(x => x.name).join(' '),
    });
  }

  const areas = [];
  for (let ai = 0; ai < D.areas.length; ai++) {
    const ly = aLy[ai].size, ty = aTy[ai].size;
    if (!ly && !ty) continue;
    areas.push({ ai, name: D.areas[ai].name, state: D.areas[ai].state, main: D.areas[ai].main, ly, ty, diff: ty - ly });
  }

  return { W, totLy: totLy.size, totTy: totTy.size, rvLy, rvTy, cats, allSubs, channels, areas, mxLy, mxTy, cmLy, cmTy, caLy, caTy, people };
}

// ---------- YoY Grouped Bar Chart (2025 / 2026 under bars, diff pills above) ----------
function yoyBarChart(items, { height = 315, clickAttr = '', clickKey = '' } = {}) {
  if (!items.length) return '<div class="empty">No docids in the selected period and filter.</div>';
  const Wc = 1100, Hc = height, padL = 52, padR = 14, padT = 48, padB = 60, iw = Wc - padL - padR, ih = Hc - padT - padB;
  const maxV = niceMax(Math.max(...items.flatMap(x => [x.ly, x.ty]), 1));
  const gw = iw / items.length, bw = Math.min(30, Math.max(12, (gw * 0.66 - 6) / 2));
  let svg = `<div class="chart-leg">
    <span><i style="background:var(--axis)"></i>${LY} docids</span>
    <span><i style="background:#10b981"></i>${TY} up vs ${LY}</span>
    <span><i style="background:#ef4444"></i>${TY} down vs ${LY}</span>
  </div><svg class="chart" viewBox="0 0 ${Wc} ${Hc}" role="img">`;
  for (const t of [0, .5, 1].map(f => f * maxV)) {
    const y = padT + ih - t / maxV * ih;
    svg += `<line x1="${padL}" x2="${Wc - padR}" y1="${y}" y2="${y}" stroke="var(--grid)" ${t ? 'stroke-dasharray="4 4"' : ''}/><text x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmtN(t)}</text>`;
  }
  items.forEach((x, i) => {
    const cx = padL + i * gw + gw / 2, x1 = cx - bw - 3, x2 = cx + 3;
    const h1 = x.ly / maxV * ih, h2 = x.ty / maxV * ih;
    const y1 = padT + ih - h1, y2 = padT + ih - h2;
    const diff = x.ty - x.ly;
    const tyCol = diff > 0 ? '#10b981' : (diff < 0 ? '#ef4444' : '#0f766e');
    const pillBg = diff > 0 ? 'var(--good-bg)' : (diff < 0 ? 'var(--bad-bg)' : 'var(--flat-bg)');
    const pillFg = diff > 0 ? 'var(--good-ink)' : (diff < 0 ? 'var(--bad-ink)' : 'var(--ink-3)');
    const pw = Math.min(gw - 8, 96);
    svg += `<rect x="${cx - pw / 2}" y="6" width="${pw}" height="20" rx="10" fill="${pillBg}"/>`;
    svg += `<text x="${cx}" y="19.5" text-anchor="middle" style="font-size:10px;font-weight:700;fill:${pillFg}">${esc(compactDiff(x.ty, x.ly))}</text>`;
    if (h1 > 0) svg += `<rect x="${x1}" y="${y1}" width="${bw}" height="${Math.max(h1, 1.5)}" rx="3" fill="var(--axis)"/>`;
    if (h2 > 0) svg += `<rect x="${x2}" y="${y2}" width="${bw}" height="${Math.max(h2, 1.5)}" rx="3" fill="${tyCol}"/>`;
    svg += `<text x="${x1 + bw / 2}" y="${y1 - 5}" text-anchor="middle" style="font-size:9.5px">${fmtN(x.ly)}</text>`;
    svg += `<text x="${x2 + bw / 2}" y="${y2 - 5}" text-anchor="middle" class="lbl-strong" style="font-size:10.5px">${fmtN(x.ty)}</text>`;
    svg += `<text x="${x1 + bw / 2}" y="${padT + ih + 13}" text-anchor="middle" style="font-size:9.5px">${LY}</text>`;
    svg += `<text x="${x2 + bw / 2}" y="${padT + ih + 13}" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:var(--ink-2)">${TY}</text>`;
    wrapLbl(x.label, items.length > 8 ? 13 : 16).forEach((ln, li) => {
      svg += `<text x="${cx}" y="${padT + ih + 30 + li * 13}" text-anchor="middle" class="${li === 0 ? 'lbl-strong' : ''}" style="font-size:10.5px">${esc(ln)}</text>`;
    });
    const attr = clickAttr && x[clickKey] != null ? ` ${clickAttr}="${x[clickKey]}"` : '';
    svg += `<rect class="hit" x="${padL + i * gw}" y="4" width="${gw}" height="${Hc - 8}" data-tip="${esc(x.tip)}"${attr}/>`;
  });
  return svg + `<line x1="${padL}" x2="${Wc - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--axis)"/></svg>`;
}

// ---------- CSV Download ----------
const csvStore = {};
function downloadCsv(key) {
  const rec = csvStore[key];
  if (!rec) return;
  const cell = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [rec.hdr.map(cell).join(','), ...rec.rows.map(r => r.map(cell).join(','))];
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `Hyderabad JDS - ${rec.title}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---------- Sorting & Table Builder ----------
function sortRows(rows, id, cols) {
  const st = S.sort[id] || { k: 'ly', dir: -1 };
  const col = cols.find(c => c.k === st.k) || cols[0];
  const val = r => col.sortv ? col.sortv(r) : r[col.k];
  return [...rows].sort((a, b) => {
    const va = val(a), vb = val(b);
    if (typeof va === 'string' && typeof vb === 'string') return va.localeCompare(vb) * st.dir;
    const na = (va == null || isNaN(va)) ? -1e18 : va, nb = (vb == null || isNaN(vb)) ? -1e18 : vb;
    return (na - nb) * st.dir;
  });
}

function renderTable(id, cols, rows, { title, caption, totalRow, afterRow, noCap = false, extraLeft = '' } = {}) {
  const q = (S.q[id] || '').trim().toLowerCase();
  const filtered = q ? rows.filter(r => cols.some(c => {
    const s = c.search ? c.search(r) : (typeof r[c.k] === 'string' ? r[c.k] : '');
    return s && s.toLowerCase().includes(q);
  })) : rows;
  const sorted = sortRows(filtered, id, cols);
  const st = S.sort[id] || { k: 'ly', dir: -1 };

  csvStore[id] = {
    title,
    hdr: cols.filter(c => c.csv !== false).map(c => c.label),
    rows: sorted.map(r => cols.filter(c => c.csv !== false).map(c => c.csv ? c.csv(r) : r[c.k])),
  };

  const ths = cols.map(c => {
    const arrow = st.k === c.k ? (st.dir > 0 ? ' ↑' : ' ↓') : '';
    const cls = [c.num ? 'num' : '', c.noSort ? '' : 'sort'].filter(Boolean).join(' ');
    return `<th scope="col" class="${cls}"${c.noSort ? '' : ` data-sort="${id}|${c.k}"`}>${esc(c.label)}${arrow}</th>`;
  }).join('');

  const body = sorted.length ? sorted.map(r => {
    const cells = cols.map(c => {
      const content = c.html ? c.html(r) : esc(c.fmt ? c.fmt(r[c.k], r) : r[c.k]);
      if (c.rowHdr) return `<th scope="row">${content}</th>`;
      return `<td class="${c.num ? 'num' : ''}" data-lbl="${esc(c.label)}">${content}</td>`;
    }).join('');
    return `<tr>${cells}</tr>${afterRow ? afterRow(r, q) : ''}`;
  }).join('') : `<tr><td colspan="${cols.length}" class="empty">No rows match the current filter.</td></tr>`;

  const tfoot = totalRow ? `<tfoot><tr>${cols.map(c => {
    const content = c.totalHtml ? c.totalHtml(totalRow) : (c.fmt && totalRow[c.k] != null ? esc(c.fmt(totalRow[c.k], totalRow)) : '');
    return `<td class="${c.num ? 'num' : ''}">${content}</td>`;
  }).join('')}</tr></tfoot>` : '';

  return `<div class="tbl-bar">
    <div class="tbl-bar-l">${extraLeft}<span class="muted" style="font-size:12.5px;font-weight:600">${fmtN(sorted.length)} rows</span></div>
    <div class="tbl-bar-l">
      <label class="search-box"><input type="search" data-search="${id}" placeholder="Search…" value="${esc(S.q[id] || '')}"></label>
      <button type="button" class="btn btn-primary" data-csv="${id}">Export CSV</button>
    </div>
  </div>
  <div tabindex="0" role="region" aria-label="${esc(caption || title)}" class="table-wrapper${noCap ? ' no-cap' : ''}">
    <table><thead><tr>${ths}</tr></thead><tbody>${body}</tbody>${tfoot}</table>
  </div>`;
}

// ---------- Tab 3: Category × Month Seasonality Heatmap ----------
function renderSeasonality(agg) {
  const fms = monthsList();
  const sFm = Math.floor(M.common_start_k / 100), sDay = M.common_start_k % 100;
  const eFm = Math.floor(M.common_end_k / 100), eDay = M.common_end_k % 100;
  const mLbl = fm => MON[fyMonNum(fm) - 1] + ((fm === sFm && sDay > 1) || fm === eFm ? '*' : '');
  const mFull = fm => MONTHS[fyMonNum(fm) - 1] + (fm === eFm ? ` (1–${eDay})` : (fm === sFm && sDay > 1 ? ` (${sDay}–end)` : ''));

  // Sort categories by full-common-range 2025 DocIDs descending
  const catList = D.cats.map((name, ci) => {
    let lySum = 0, tySum = 0;
    for (const fm of fms) {
      const k = ci + '|' + fm;
      lySum += agg.cmLy.get(k) ? agg.cmLy.get(k).size : 0;
      tySum += agg.cmTy.get(k) ? agg.cmTy.get(k).size : 0;
    }
    return { ci, name, lySum, tySum };
  }).filter(c => c.lySum || c.tySum).sort((a, b) => b.lySum - a.lySum || b.tySum - a.tySum);

  csvStore['seasonality'] = {
    title: 'JDS Category Seasonality (YoY)',
    hdr: ['Category', ...fms.flatMap(fm => [`${MON[fyMonNum(fm) - 1]} ${LY}`, `${MON[fyMonNum(fm) - 1]} ${TY}`, `${MON[fyMonNum(fm) - 1]} YoY%`])],
    rows: catList.map(c => [c.name, ...fms.flatMap(fm => {
      const k = c.ci + '|' + fm;
      const ly = agg.cmLy.get(k) ? agg.cmLy.get(k).size : 0, ty = agg.cmTy.get(k) ? agg.cmTy.get(k).size : 0;
      return [ly, ty, fmtYoy(ty, ly)];
    })]),
  };

  const hdrs = `<th>Category</th>${fms.map(fm => `<th class="num" title="${esc(mFull(fm))}">${esc(mLbl(fm))}</th>`).join('')}`;
  const rows = catList.map(c => {
    const cells = fms.map(fm => {
      const k = c.ci + '|' + fm;
      const ly = agg.cmLy.get(k) ? agg.cmLy.get(k).size : 0;
      const ty = agg.cmTy.get(k) ? agg.cmTy.get(k).size : 0;
      if (!ly && !ty) return '<td class="num muted">—</td>';
      const d = ty - ly, ratio = ly > 0 ? d / ly : (ty > 0 ? 1 : 0);
      const cls = ratio >= 0.15 ? 'up2' : d > 0 ? 'up' : (ratio <= -0.15 ? 'dn2' : d < 0 ? 'dn' : '');
      const sub = S.seaMode === 'delta' ? fmtDelta(d) : (ly > 0 ? `${d > 0 ? '+' : ''}${Math.round(ratio * 100)}%` : 'NEW');
      const tip = `<div class="tt-t">${esc(c.name)} · ${esc(mFull(fm))}</div>${LY} docids: <b>${fmtN(ly)}</b><br>${TY} docids: <b>${fmtN(ty)}</b><br>YoY: <b>${fmtDelta(d)} (${fmtYoy(ty, ly)})</b>`;
      return `<td class="num" data-lbl="${esc(MON[fyMonNum(fm) - 1])}"><button type="button" class="mx-cell ${cls}" data-opencatmon="${c.ci}|${fm}" data-tip="${esc(tip)}"><b>${fmtN(ty)}</b><small class="${d > 0 ? 'ok-t' : d < 0 ? 'lo-t' : 'muted'}">${esc(sub)}</small></button></td>`;
    }).join('');
    return `<tr><th scope="row"><button type="button" class="link-btn" data-opencat="${c.ci}">${esc(c.name)}</button></th>${cells}</tr>`;
  }).join('');

  return renderHero(agg, 'Category Seasonality — Month-by-Month Heatmap')
    + `<div class="card">
        <div class="c-head">
          <div><h2><i class="dot" style="background:#0f766e"></i>Categories × Months (${TY} DocIDs &amp; YoY)</h2>
          <div class="c-sub">Spot whether a category drop happened in one month or is a steady slide · click any cell to open that Category in that Month · * partial boundary month (${M.common_start}..${M.common_end})</div></div>
          <div class="tbl-bar-l">
            <div class="seg" role="group" aria-label="Cell label">
              <button type="button" data-seamode="pct" aria-pressed="${S.seaMode === 'pct'}">Show YoY %</button>
              <button type="button" data-seamode="delta" aria-pressed="${S.seaMode === 'delta'}">Show Net Δ</button>
            </div>
            <button type="button" class="btn btn-primary" data-csv="seasonality">Export CSV</button>
          </div>
        </div>
        <div tabindex="0" role="region" aria-label="Category by Month Seasonality Heatmap" class="table-wrapper no-cap">
          <table><thead><tr>${hdrs}</tr></thead><tbody>${rows}</tbody></table>
        </div>
      </div>`;
}

// ---------- Tab 4: Category × Area (Geography Matrix) ----------
function renderGeo(agg) {
  let cols = [];
  if (S.geoView === 'ts') {
    cols = agg.areas.filter(a => a.state === 'TS').sort((a, b) => (b.main - a.main) || (b.ly - a.ly) || (b.ty - a.ty)).slice(0, 10);
  } else if (S.geoView === 'ap') {
    cols = agg.areas.filter(a => a.state === 'AP').sort((a, b) => b.ly - a.ly || b.ty - a.ty).slice(0, 10);
  } else {
    cols = [...agg.areas].sort((a, b) => b.ly - a.ly || b.ty - a.ty).slice(0, 10);
  }
  const sortedCats = [...agg.cats].sort((a, b) => b.ly - a.ly || b.ty - a.ty);

  csvStore['geo_matrix'] = {
    title: `JDS Category by Area (${S.geoView.toUpperCase()})`,
    hdr: ['Category', `Total ${LY}`, `Total ${TY}`, ...cols.flatMap(a => [`${a.name} ${LY}`, `${a.name} ${TY}`, `${a.name} Δ`])],
    rows: sortedCats.map(c => [c.name, c.ly, c.ty, ...cols.flatMap(a => {
      const k = c.ci + '|' + a.ai;
      const ly = agg.caLy.get(k) ? agg.caLy.get(k).size : 0, ty = agg.caTy.get(k) ? agg.caTy.get(k).size : 0;
      return [ly, ty, ty - ly];
    })]),
  };

  const hdrs = `<th>Category</th><th class="num">Total ${TY} (Δ)</th>${cols.map(a => `<th class="num">${esc(a.name)}</th>`).join('')}`;
  const rows = sortedCats.map(c => {
    const cells = cols.map(a => {
      const k = c.ci + '|' + a.ai;
      const ly = agg.caLy.get(k) ? agg.caLy.get(k).size : 0;
      const ty = agg.caTy.get(k) ? agg.caTy.get(k).size : 0;
      if (!ly && !ty) return '<td class="num muted">—</td>';
      const d = ty - ly, ratio = ly > 0 ? d / ly : (ty > 0 ? 1 : 0);
      const cls = ratio >= 0.15 ? 'up2' : d > 0 ? 'up' : (ratio <= -0.15 ? 'dn2' : d < 0 ? 'dn' : '');
      const sub = S.geoMode === 'pct' ? (ly > 0 ? `${d > 0 ? '+' : ''}${Math.round(ratio * 100)}%` : 'NEW') : fmtDelta(d);
      const tip = `<div class="tt-t">${esc(c.name)} × ${esc(a.name)} (${a.state})</div>${LY} docids: <b>${fmtN(ly)}</b><br>${TY} docids: <b>${fmtN(ty)}</b><br>YoY: <b>${fmtDelta(d)} (${fmtYoy(ty, ly)})</b>`;
      return `<td class="num" data-lbl="${esc(a.name)}"><button type="button" class="mx-cell ${cls}" data-opencatarea="${c.ci}|${a.ai}" data-tip="${esc(tip)}"><b>${fmtN(ty)}</b><small class="${d > 0 ? 'ok-t' : d < 0 ? 'lo-t' : 'muted'}">${esc(sub)}</small></button></td>`;
    }).join('');
    return `<tr><th scope="row"><button type="button" class="link-btn" data-opencat="${c.ci}">${esc(c.name)}</button></th>
      <td class="num" data-lbl="Total"><b>${fmtN(c.ty)}</b> <span class="${c.diff > 0 ? 'ok-t' : c.diff < 0 ? 'lo-t' : 'muted'}" style="font-size:11.5px">(${fmtDelta(c.diff)})</span></td>${cells}</tr>`;
  }).join('');

  const topAreasChart = cols.map(a => ({
    label: a.name, ly: a.ly, ty: a.ty,
    tip: `<div class="tt-t">${esc(a.name)} (${a.state}) · ${esc(agg.W.label)}</div>${LY} docids: <b>${fmtN(a.ly)}</b><br>${TY} docids: <b>${fmtN(a.ty)}</b><br>YoY: <b>${fmtDelta(a.diff)} (${fmtYoy(a.ty, a.ly)})</b>`,
  }));

  return renderHero(agg, 'Category × Geography (Telangana & Andhra Pradesh)')
    + `<div class="card">
        <div class="c-head">
          <div><h2><i class="dot" style="background:#0f766e"></i>Categories × Areas (${TY} DocIDs &amp; YoY)</h2>
          <div class="c-sub">See which districts &amp; cities each category is winning or losing · click any cell to inspect Sales Groups, Channels &amp; Reps in that area</div></div>
          <div class="tbl-bar-l">
            <div class="seg" role="group" aria-label="Area slice">
              <button type="button" data-geoview="top" aria-pressed="${S.geoView === 'top'}">Top 10 Overall</button>
              <button type="button" data-geoview="ts" aria-pressed="${S.geoView === 'ts'}">Telangana Districts</button>
              <button type="button" data-geoview="ap" aria-pressed="${S.geoView === 'ap'}">Andhra Cities</button>
            </div>
            <div class="seg" role="group" aria-label="Cell label">
              <button type="button" data-geomode="delta" aria-pressed="${S.geoMode === 'delta'}">Net Δ</button>
              <button type="button" data-geomode="pct" aria-pressed="${S.geoMode === 'pct'}">YoY %</button>
            </div>
            <button type="button" class="btn btn-primary" data-csv="geo_matrix">Export CSV</button>
          </div>
        </div>
        <div tabindex="0" role="region" aria-label="Category by Area Matrix" class="table-wrapper no-cap">
          <table><thead><tr>${hdrs}</tr></thead><tbody>${rows}</tbody></table>
        </div>
      </div>`
    + `<div class="card" style="margin-top:16px">
        <div class="c-head"><div><h2><i class="dot" style="background:#f59e0b"></i>${S.geoView === 'ts' ? 'Telangana Districts' : S.geoView === 'ap' ? 'Top 10 Andhra Pradesh Cities' : 'Top 10 Areas'} · ${esc(agg.W.label)}</h2></div></div>
        ${yoyBarChart(topAreasChart)}
      </div>`;
}

// ---------- Tab 5: Category × Channel Matrix ----------
function renderMatrix(agg) {
  const topChs = [...agg.channels].sort((a, b) => b.ly - a.ly || b.ty - a.ty).slice(0, 7);
  const sortedCats = [...agg.cats].sort((a, b) => b.ly - a.ly || b.ty - a.ty);
  const hdrs = `<th>Category</th><th class="num">Total ${TY} (Δ)</th>${topChs.map(ch => `<th class="num">${esc(ch.name)}</th>`).join('')}`;
  const rows = sortedCats.map(c => {
    const cells = topChs.map(ch => {
      const mk = c.ci + '|' + ch.i;
      const ly = agg.mxLy.get(mk) ? agg.mxLy.get(mk).size : 0;
      const ty = agg.mxTy.get(mk) ? agg.mxTy.get(mk).size : 0;
      if (!ly && !ty) return '<td class="num muted">—</td>';
      const d = ty - ly;
      const cls = d > 0 ? 'up' : (d < 0 ? 'dn' : '');
      const tip = `<div class="tt-t">${esc(c.name)} × ${esc(ch.name)}</div>${LY} docids: <b>${fmtN(ly)}</b><br>${TY} docids: <b>${fmtN(ty)}</b><br>YoY: <b>${fmtDelta(d)} (${fmtYoy(ty, ly)})</b>`;
      return `<td class="num" data-lbl="${esc(ch.name)}"><button type="button" class="mx-cell ${cls}" data-opencatch="${c.ci}|${ch.i}" data-tip="${esc(tip)}"><b>${fmtN(ty)}</b><small class="${d > 0 ? 'ok-t' : d < 0 ? 'lo-t' : 'muted'}">${fmtDelta(d)}</small></button></td>`;
    }).join('');
    return `<tr><th scope="row"><button type="button" class="link-btn" data-opencat="${c.ci}">${esc(c.name)}</button></th>
      <td class="num" data-lbl="Total"><b>${fmtN(c.ty)}</b> <span class="${c.diff > 0 ? 'ok-t' : c.diff < 0 ? 'lo-t' : 'muted'}" style="font-size:11.5px">(${fmtDelta(c.diff)})</span></td>${cells}</tr>`;
  }).join('');

  const tot = {
    name: 'Total', verdict: verdict(agg.totTy, agg.totLy), ly: agg.totLy, ty: agg.totTy,
    diff: agg.totTy - agg.totLy, rvLy: agg.rvLy, rvTy: agg.rvTy,
  };

  return renderHero(agg, 'Category × JDS Channel Breakdown')
    + `<div class="card">
        <div class="c-head"><div><h2><i class="dot" style="background:#0f766e"></i>Category × Channel Matrix (${TY} DocIDs &amp; YoY Δ)</h2>
        <div class="c-sub">Green = growing vs ${LY} · Red = dropping vs ${LY} · Click any cell to inspect sales groups &amp; reps inside that Category × Channel</div></div></div>
        <div tabindex="0" role="region" aria-label="Category by Channel Matrix" class="table-wrapper no-cap">
          <table><thead><tr>${hdrs}</tr></thead><tbody>${rows}</tbody></table>
        </div>
      </div>`
    + `<div class="card" style="margin-top:16px">
        <div class="c-head"><div><h2><i class="dot" style="background:#f59e0b"></i>JDS Channel Summary &amp; Category Drivers</h2></div></div>
        ${renderTable('channels', [
          { k: 'name', label: 'JDS Channel', rowHdr: true, totalHtml: () => 'Total' },
          { k: 'verdict', label: 'Status', html: c => vPill(c.verdict), sortv: c => ({ good: 2, flat: 1, bad: 0 }[c.verdict]), csv: c => c.verdict.toUpperCase(), totalHtml: t => vPill(t.verdict) },
          { k: 'ly', label: `${LY} DocIDs`, num: true, fmt: fmtN },
          { k: 'ty', label: `${TY} DocIDs`, num: true, html: c => `<b>${fmtN(c.ty)}</b>`, totalHtml: t => `<b>${fmtN(t.ty)}</b>` },
          { k: 'diff', label: 'Net Δ', num: true, html: c => `<span class="${c.diff > 0 ? 'ok-t' : c.diff < 0 ? 'lo-t' : 'muted'}">${fmtDelta(c.diff)}</span>`, totalHtml: t => `<span class="${t.diff > 0 ? 'ok-t' : t.diff < 0 ? 'lo-t' : 'muted'}">${fmtDelta(t.diff)}</span>` },
          { k: 'yoy', label: 'YoY %', num: true, sortv: c => c.yoy == null ? -999 : (isFinite(c.yoy) ? c.yoy : 999), html: c => `<span class="${c.diff > 0 ? 'ok-t' : c.diff < 0 ? 'lo-t' : 'muted'}">${fmtYoy(c.ty, c.ly)}</span>`, csv: c => fmtYoy(c.ty, c.ly), totalHtml: t => fmtYoy(t.ty, t.ly) },
          { k: 'rvLy', label: `${LY} RV`, num: true, fmt: fmtRv },
          { k: 'rvTy', label: `${TY} RV`, num: true, fmt: fmtRv },
          { k: 'bestC', label: 'Top Growing Category', noSort: true, html: c => c.bestC ? `<span class="ok-t">${esc(c.bestC.name)} (+${fmtN(c.bestC.d)})</span>` : '<span class="muted">—</span>', csv: c => c.bestC ? `${c.bestC.name} (+${c.bestC.d})` : '' },
          { k: 'worstC', label: 'Biggest Drop Category', noSort: true, html: c => c.worstC ? `<span class="lo-t">${esc(c.worstC.name)} (${fmtDelta(c.worstC.d)})</span>` : '<span class="muted">—</span>', csv: c => c.worstC ? `${c.worstC.name} (${c.worstC.d})` : '' },
        ], agg.channels, { title: 'JDS Channels YoY', totalRow: tot, noCap: true })}
      </div>`;
}

// ---------- Deep Category / Sales Group Native <dialog> ----------
function openDialog(cfg) {
  S.dlg = cfg;
  const W = cfg.fm != null
    ? { a: Math.max(M.common_start_k, cfg.fm * 100 + 1), b: Math.min(M.common_end_k, cfg.fm * 100 + 31), label: MONTHS[fyMonNum(cfg.fm) - 1] }
    : activeWindow();
  const fms = monthsList();
  const mLy = new Map(), mTy = new Map();
  const totLyS = new Set(), totTyS = new Set();
  const subMap = new Map(), chMap = new Map(), areaMap = new Map(), empMap = new Map();
  const roleIdx = (cfg.role || 'tme') === 'me' ? 8 : 7;

  for (const r of D.rows) {
    const [yr, k, di, ai, si, chi, flags, tmeI, meI, rv] = r;
    if (!scopeOk(ai)) continue;
    if (S.ch >= 0 && chi !== S.ch) continue;
    if (cfg.ch != null && chi !== cfg.ch) continue;
    if (cfg.ai != null && ai !== cfg.ai) continue;
    if (S.fresh !== 'all' && (flags & 1) !== +S.fresh) continue;

    if (cfg.kind === 'cat' && D.subcats[si][0] !== cfg.ci) continue;
    if (cfg.kind === 'sub' && si !== cfg.si) continue;

    if (k >= M.common_start_k && k <= M.common_end_k) {
      const fm = Math.floor(k / 100);
      const mp = yr === 1 ? mTy : mLy;
      let st = mp.get(fm); if (!st) { st = new Set(); mp.set(fm, st); }
      st.add(di);
    }
    if (k < W.a || k > W.b) continue;
    (yr === 1 ? totTyS : totLyS).add(di);

    if (cfg.kind === 'cat') {
      let s = subMap.get(si); if (!s) { s = { si, name: D.subcats[si][1], ly: new Set(), ty: new Set(), rvLy: 0, rvTy: 0 }; subMap.set(si, s); }
      (yr === 1 ? s.ty : s.ly).add(di); if (yr === 1) s.rvTy += rv; else s.rvLy += rv;
    }
    let ch = chMap.get(chi); if (!ch) { ch = { chi, name: D.channels[chi], ly: new Set(), ty: new Set(), rvTy: 0 }; chMap.set(chi, ch); }
    (yr === 1 ? ch.ty : ch.ly).add(di); if (yr === 1) ch.rvTy += rv;

    let ar = areaMap.get(ai); if (!ar) { ar = { ai, name: D.areas[ai].name, state: D.areas[ai].state, ly: new Set(), ty: new Set(), rvTy: 0 }; areaMap.set(ai, ar); }
    (yr === 1 ? ar.ty : ar.ly).add(di); if (yr === 1) ar.rvTy += rv;

    const ei = roleIdx === 8 ? meI : tmeI;
    if (ei >= 0) {
      let e = empMap.get(ei); if (!e) { e = { ei, ...empLabel(ei), ly: new Set(), ty: new Set(), rvLy: 0, rvTy: 0 }; empMap.set(ei, e); }
      (yr === 1 ? e.ty : e.ly).add(di); if (yr === 1) e.rvTy += rv; else e.rvLy += rv;
    }
  }

  const totLy = totLyS.size, totTy = totTyS.size, vd = verdict(totTy, totLy);
  const suffix = (cfg.ch != null ? ` × ${D.channels[cfg.ch]}` : '')
    + (cfg.ai != null ? ` × ${D.areas[cfg.ai].name}` : '')
    + (cfg.fm != null ? ` · ${MONTHS[fyMonNum(cfg.fm) - 1]}` : '');
  const title = (cfg.kind === 'cat' ? D.cats[cfg.ci] : D.subcats[cfg.si][1]) + suffix;
  const monItems = fms.map(fm => {
    const ly = mLy.get(fm) ? mLy.get(fm).size : 0, ty = mTy.get(fm) ? mTy.get(fm).size : 0;
    return { label: MON[fyMonNum(fm) - 1], ly, ty, tip: `<div class="tt-t">${MONTHS[fyMonNum(fm) - 1]}</div>${LY}: <b>${fmtN(ly)}</b><br>${TY}: <b>${fmtN(ty)}</b><br>YoY: <b>${fmtDelta(ty - ly)} (${fmtYoy(ty, ly)})</b>` };
  });

  const subRows = [...subMap.values()].map(x => ({ ...x, ly: x.ly.size, ty: x.ty.size, diff: x.ty.size - x.ly.size })).sort((a, b) => b.ly - a.ly || b.ty - a.ty);
  const chRows = [...chMap.values()].map(x => ({ ...x, ly: x.ly.size, ty: x.ty.size, diff: x.ty.size - x.ly.size })).sort((a, b) => b.ly - a.ly || b.ty - a.ty);
  const arRows = [...areaMap.values()].map(x => ({ ...x, ly: x.ly.size, ty: x.ty.size, diff: x.ty.size - x.ly.size })).sort((a, b) => b.ly - a.ly || b.ty - a.ty);
  const empRows = [...empMap.values()].map(x => ({ ...x, ly: x.ly.size, ty: x.ty.size, diff: x.ty.size - x.ly.size })).sort((a, b) => b.ty - a.ty || b.ly - a.ly);

  csvStore['dlg_emp'] = {
    title: `${title} - Who secured (${(cfg.role || 'tme').toUpperCase()})`,
    hdr: ['Employee', 'Emp ID', `${LY} DocIDs`, `${TY} DocIDs`, 'Net Delta', 'YoY %', `${LY} RV`, `${TY} RV`],
    rows: empRows.map(e => [e.label, e.code, e.ly, e.ty, e.diff, fmtYoy(e.ty, e.ly), e.rvLy, e.rvTy]),
  };

  const tab = cfg.tab || (cfg.kind === 'cat' ? 'subs' : 'ch');
  let bodyTbl = '';
  if (tab === 'subs') {
    bodyTbl = `<div tabindex="0" role="region" aria-label="Sales groups" class="table-wrapper" style="max-block-size:320px">
      <table><thead><tr><th>Sales Group</th><th class="num">${LY}</th><th class="num">${TY}</th><th class="num">Δ</th><th class="num">YoY</th><th class="num">${TY} RV</th></tr></thead>
      <tbody>${subRows.slice(0, 120).map(x => `<tr><th scope="row"><button type="button" class="link-btn" data-opensub="${cfg.ci}|${x.si}">${esc(x.name)}</button></th><td class="num">${fmtN(x.ly)}</td><td class="num"><b>${fmtN(x.ty)}</b></td><td class="num"><span class="${x.diff > 0 ? 'ok-t' : x.diff < 0 ? 'lo-t' : 'muted'}">${fmtDelta(x.diff)}</span></td><td class="num">${fmtYoy(x.ty, x.ly)}</td><td class="num muted">${fmtRv(x.rvTy)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No sales groups.</td></tr>'}</tbody></table>
    </div>`;
  } else if (tab === 'ch') {
    bodyTbl = `<div tabindex="0" role="region" aria-label="Channel split" class="table-wrapper" style="max-block-size:320px">
      <table><thead><tr><th>JDS Channel</th><th class="num">${LY}</th><th class="num">${TY}</th><th class="num">Δ</th><th class="num">YoY</th><th class="num">${TY} RV</th></tr></thead>
      <tbody>${chRows.map(x => `<tr><th scope="row">${esc(x.name)}</th><td class="num">${fmtN(x.ly)}</td><td class="num"><b>${fmtN(x.ty)}</b></td><td class="num"><span class="${x.diff > 0 ? 'ok-t' : x.diff < 0 ? 'lo-t' : 'muted'}">${fmtDelta(x.diff)}</span></td><td class="num">${fmtYoy(x.ty, x.ly)}</td><td class="num muted">${fmtRv(x.rvTy)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No channels.</td></tr>'}</tbody></table>
    </div>`;
  } else if (tab === 'area') {
    bodyTbl = `<div tabindex="0" role="region" aria-label="Area split" class="table-wrapper" style="max-block-size:320px">
      <table><thead><tr><th>Area / District</th><th>State</th><th class="num">${LY}</th><th class="num">${TY}</th><th class="num">Δ</th><th class="num">YoY</th></tr></thead>
      <tbody>${arRows.slice(0, 60).map(x => `<tr><th scope="row">${esc(x.name)}</th><td class="muted">${x.state === 'TS' ? 'Telangana' : x.state === 'AP' ? 'Andhra' : 'Other'}</td><td class="num">${fmtN(x.ly)}</td><td class="num"><b>${fmtN(x.ty)}</b></td><td class="num"><span class="${x.diff > 0 ? 'ok-t' : x.diff < 0 ? 'lo-t' : 'muted'}">${fmtDelta(x.diff)}</span></td><td class="num">${fmtYoy(x.ty, x.ly)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No areas.</td></tr>'}</tbody></table>
    </div>`;
  } else {
    bodyTbl = `<div class="dlg-bar">
        <div class="seg"><button type="button" data-dlgrole="tme" aria-pressed="${(cfg.role || 'tme') === 'tme'}">TMEs</button><button type="button" data-dlgrole="me" aria-pressed="${cfg.role === 'me'}">MEs</button></div>
        <button type="button" class="btn btn-primary" data-csv="dlg_emp">Export CSV</button>
      </div>
      <div tabindex="0" role="region" aria-label="Who secured docids" class="table-wrapper" style="max-block-size:300px">
        <table><thead><tr><th>Employee</th><th class="num">${LY}</th><th class="num">${TY}</th><th class="num">Δ</th><th class="num">YoY</th><th class="num">${TY} RV</th></tr></thead>
        <tbody>${empRows.slice(0, 80).map(e => `<tr><th scope="row">${esc(e.label)}<span class="emp-code">${esc(e.code)}</span></th><td class="num">${fmtN(e.ly)}</td><td class="num"><b>${fmtN(e.ty)}</b></td><td class="num"><span class="${e.diff > 0 ? 'ok-t' : e.diff < 0 ? 'lo-t' : 'muted'}">${fmtDelta(e.diff)}</span></td><td class="num">${fmtYoy(e.ty, e.ly)}</td><td class="num muted">${fmtRv(e.rvTy)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No employees found.</td></tr>'}</tbody></table>
      </div>`;
  }

  dlg.innerHTML = `<div class="dlg-head ${vd}">
      <div>
        ${cfg.kind === 'sub' ? `<button type="button" class="dlg-back" data-opencat="${cfg.ci}">← All ${esc(D.cats[cfg.ci])} sales groups</button>` : ''}
        <div class="dlg-meta">${esc(W.label)} · ${esc(scopeLabel())}</div>
        <h2 id="dlgTitle">${esc(title)}</h2>
        <div class="dlg-meta">${LY}: <b>${fmtN(totLy)}</b> → ${TY}: <b>${fmtN(totTy)}</b> (${fmtDelta(totTy - totLy)}, ${fmtYoy(totTy, totLy)})</div>
      </div>
      <button type="button" class="dlg-x" data-dlgclose="1" aria-label="Close dialog">✕</button>
    </div>
    <div class="dlg-body">
      <div>${yoyBarChart(monItems, { height: 210 })}</div>
      <div class="dlg-bar">
        <div class="seg">
          ${cfg.kind === 'cat' ? `<button type="button" data-dlgtab="subs" aria-pressed="${tab === 'subs'}">Sales Groups (${subRows.length})</button>` : ''}
          <button type="button" data-dlgtab="ch" aria-pressed="${tab === 'ch'}">By Channel (${chRows.length})</button>
          <button type="button" data-dlgtab="area" aria-pressed="${tab === 'area'}">By Area (${arRows.length})</button>
          <button type="button" data-dlgtab="emp" aria-pressed="${tab === 'emp'}">Who Secured (${empRows.length})</button>
        </div>
        ${cfg.kind === 'cat' ? `<button type="button" class="btn" data-jumpcat="${cfg.ci}">Open full Sales Groups tab →</button>` : ''}
      </div>
      ${bodyTbl}
    </div>`;
  if (!dlg.open) dlg.showModal();
}

// ---------- Render Loop ----------
function render() {
  document.querySelectorAll('.nav-tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  renderRibbon();
  const agg = aggregate();
  let html = '';
  if (S.tab === 'categories') html = renderCategories(agg);
  else if (S.tab === 'salesgroups') html = renderSalesGroups(agg);
  else if (S.tab === 'seasonality') html = renderSeasonality(agg);
  else if (S.tab === 'geo') html = renderGeo(agg);
  else if (S.tab === 'matrix') html = renderMatrix(agg);
  else html = renderPeople(agg);
  html += `<div class="note">Source: <b>ops_analytics.tbl_modified_deal_level_data</b> (Hyderabad JDS — TME &amp; ME only, excluding JDA, JDA-B2B &amp; Self Signup; total docids = <b>COUNT(DISTINCT docid)</b>) mapped via <b>vertical_owner.tbl_company_vertical_mapping_SB</b> &amp; <b>db_paidcontracts.hr_all_daily_copy_ganesh</b>. Same-period range: ${M.ly_start}..${M.ly_end} vs ${M.ty_start}..${M.ty_end} (common: ${M.common_start}..${M.common_end}).</div>`;
  $('#app').innerHTML = html;
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-win],[data-scope],[data-fresh],[data-catst],[data-sgst],[data-seamode],[data-geoview],[data-geomode],[data-cattog],[data-catall],[data-ptog],[data-role],[data-sort],[data-csv],[data-opencat],[data-opensub],[data-opencatch],[data-opencatmon],[data-opencatarea],[data-jumpcat],[data-dlgtab],[data-dlgrole],[data-dlgclose],#resetBtn');
  if (!t) return;
  const ds = t.dataset;
  if (t.id === 'resetBtn') { S.win = 'ytd'; S.month = 0; S.scope = 'all'; S.fresh = 'all'; S.ch = -1; S.catFilter = -1; render(); return; }
  if (ds.tab) { S.tab = ds.tab; history.replaceState(null, '', '#' + ds.tab); window.scrollTo(0, 0); render(); }
  else if (ds.win) { S.win = ds.win; S.month = 0; render(); }
  else if (ds.scope) { S.scope = ds.scope; render(); }
  else if (ds.fresh) { S.fresh = ds.fresh; render(); }
  else if (ds.catst) { S.catSt = ds.catst; render(); }
  else if (ds.sgst) { S.sgSt = ds.sgst; render(); }
  else if (ds.seamode) { S.seaMode = ds.seamode; render(); }
  else if (ds.geoview) { S.geoView = ds.geoview; render(); }
  else if (ds.geomode) { S.geoMode = ds.geomode; render(); }
  else if (ds.cattog != null) { const ci = +ds.cattog; S.catOpen.has(ci) ? S.catOpen.delete(ci) : S.catOpen.add(ci); render(); }
  else if (ds.catall) { S.catOpen = ds.catall === 'open' ? new Set(aggregate().cats.map(c => c.ci)) : new Set(); render(); }
  else if (ds.ptog != null) { const ei = +ds.ptog; S.peopleOpen.has(ei) ? S.peopleOpen.delete(ei) : S.peopleOpen.add(ei); render(); }
  else if (ds.role) { S.peopleRole = ds.role; S.peopleOpen = new Set(); render(); }
  else if (ds.sort) {
    const [id, k] = ds.sort.split('|');
    const st = S.sort[id] || (S.sort[id] = { k, dir: -1 });
    if (st.k === k) st.dir *= -1; else { st.k = k; st.dir = -1; }
    render();
  }
  else if (ds.csv) downloadCsv(ds.csv);
  else if (ds.opencat != null) openDialog({ kind: 'cat', ci: +ds.opencat, tab: 'subs', role: 'tme' });
  else if (ds.opensub) { const [ci, si] = ds.opensub.split('|').map(Number); openDialog({ kind: 'sub', ci, si, tab: 'ch', role: 'tme' }); }
  else if (ds.opencatch) { const [ci, ch] = ds.opencatch.split('|').map(Number); openDialog({ kind: 'cat', ci, ch, tab: 'subs', role: 'tme' }); }
  else if (ds.opencatmon) { const [ci, fm] = ds.opencatmon.split('|').map(Number); openDialog({ kind: 'cat', ci, fm, tab: 'subs', role: 'tme' }); }
  else if (ds.opencatarea) { const [ci, ai] = ds.opencatarea.split('|').map(Number); openDialog({ kind: 'cat', ci, ai, tab: 'subs', role: 'tme' }); }
  else if (ds.jumpcat != null) { if (dlg.open) dlg.close(); S.tab = 'salesgroups'; S.catFilter = +ds.jumpcat; S.sgSt = 'all'; history.replaceState(null, '', '#salesgroups'); window.scrollTo(0, 0); render(); }
  else if (ds.dlgtab && S.dlg) openDialog({ ...S.dlg, tab: ds.dlgtab });
  else if (ds.dlgrole && S.dlg) openDialog({ ...S.dlg, role: ds.dlgrole, tab: 'emp' });
  else if (ds.dlgclose) dlg.close();
});

document.addEventListener('change', e => {
  if (e.target.id === 'monthSel') { const v = +e.target.value; if (v) { S.win = 'month'; S.month = v; } else { S.win = 'ytd'; S.month = 0; } render(); }
  else if (e.target.id === 'chSel') { S.ch = +e.target.value; render(); }
  else if (e.target.id === 'catSel') { S.catFilter = +e.target.value; render(); }
});

document.addEventListener('input', e => {
  const id = e.target.dataset && e.target.dataset.search;
  if (!id) return;
  S.q[id] = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const inp = document.querySelector(`input[data-search="${id}"]`);
  if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
});

// Tooltip
const tipEl = $('#tip');
document.addEventListener('pointermove', e => {
  const h = e.target.closest('[data-tip]');
  if (!h) { tipEl.style.display = 'none'; return; }
  tipEl.innerHTML = h.dataset.tip;
  tipEl.style.display = 'block';
  const x = Math.min(window.innerWidth - tipEl.offsetWidth - 12, e.clientX + 14);
  const y = Math.min(window.innerHeight - tipEl.offsetHeight - 12, e.clientY + 14);
  tipEl.style.left = Math.max(8, x) + 'px';
  tipEl.style.top = Math.max(8, y) + 'px';
});
document.addEventListener('pointerleave', () => { tipEl.style.display = 'none'; });

render();
})();
</script>
</body>
</html>
