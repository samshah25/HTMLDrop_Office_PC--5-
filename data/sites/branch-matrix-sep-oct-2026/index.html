<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Branch Matrix</title>
<style>
:root{--bg:#fff;--fg:#1a1d23;--mut:#667085;--line:#e4e7ec;--card:#f8f9fb;--acc:#2f5bea;--hi:#f1f4fb;--bad:#fde8e8;--badf:#b42318;--good:#e6f4ea;--goodf:#157347;--warn:#fff4d6;--warnf:#8a5a00;--dis:#f2f4f7}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161a;--fg:#e8eaee;--mut:#9aa3b2;--line:#2b2f37;--card:#1b1e24;--acc:#7c9cff;--hi:#1e222b;--bad:#3a1d1d;--badf:#ff9b94;--good:#1b3326;--goodf:#7fd6a0;--warn:#3a3016;--warnf:#f0c862;--dis:#20232a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:21px;margin:0 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.bar{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.lbl{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--fg);padding:7px 14px;font:inherit;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:78vh}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:7px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);z-index:2;border-right:1px solid var(--line)}
thead th{background:var(--card);font-weight:600;font-size:12.5px;position:sticky;z-index:3;vertical-align:bottom;white-space:normal;min-width:84px}
thead tr.g1 th{top:0;text-align:center;font-size:12px;color:var(--mut);border-left:1px solid var(--line)}
thead tr.g2 th{top:30px}
thead th:first-child{z-index:4;background:var(--card)}
tr.pi td{font-weight:700;background:var(--hi);border-bottom:2px solid var(--line)}tr.pi td:first-child{background:var(--hi)}
tr.pi2 td{font-weight:600;background:var(--hi);border-bottom:1px solid var(--line)}tr.pi2 td:first-child{background:var(--hi)}
td.s{border-left:1px solid var(--line)}
td.bad{background:var(--bad);color:var(--badf);font-weight:600}td.good{background:var(--good);color:var(--goodf);font-weight:600}
td.dis,th.dis{background:var(--dis)!important;color:var(--mut)!important;font-weight:400}
td.strat{text-align:left;white-space:normal;min-width:330px;max-width:420px;border-left:1px solid var(--line)}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;margin:1px 3px 1px 0;background:var(--warn);color:var(--warnf)}
.chip.r{background:var(--bad);color:var(--badf)}.chip.g{background:var(--good);color:var(--goodf)}
.act{font-weight:600;display:block;margin-bottom:2px}
.sumbox{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 14px;background:var(--card)}
.sumbox h2{font-size:14px;margin:0 0 8px}.sumbox .row{margin:5px 0;line-height:1.5}.sumbox b{font-weight:600}
.note{color:var(--mut);font-size:12.5px;margin-top:14px;line-height:1.65}
.note table{width:auto;min-width:0;margin:8px 0}.note th,.note td{padding:3px 10px;font-size:12px;position:static;border:0;border-bottom:1px solid var(--line)}
.chs{color:var(--acc);font-weight:600}
thead tr.g2 th[data-sc]{cursor:pointer;user-select:none}thead tr.g2 th[data-sc]:hover{color:var(--acc)}
.arw{color:var(--acc);font-size:11px;margin-left:3px}
thead tr.g3 th{padding:4px 6px;background:var(--card);border-bottom:2px solid var(--line);font-weight:400}
thead tr.g3 th:first-child{background:var(--card)}
thead tr.g3 input{width:100%;min-width:72px;font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)}
thead tr.g3 input:disabled{background:var(--dis)}
#q{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:190px}
.cnt{font-size:12.5px;color:var(--mut);margin:0 0 8px;min-height:20px}.cnt button{font:inherit;font-size:12.5px;margin-left:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--acc);padding:1px 8px;cursor:pointer}
.tag{font-size:10.5px;font-weight:600;color:var(--acc);margin-left:6px;border:1px solid var(--acc);border-radius:4px;padding:0 4px;cursor:help}
.info{color:var(--acc);cursor:help;font-weight:700}
thead tr.g1 th.cvh{color:var(--acc);font-weight:700}
.rm{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:0 16px;background:var(--card)}
.rm summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:13.5px}.rm .note{margin:0 0 12px;padding-top:2px}
select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
