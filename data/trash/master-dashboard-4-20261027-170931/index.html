<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics Hub - Port 8077 (Titanium Gunmetal & Cool Silver)</title>
<!-- MODERN REFINED TYPOGRAPHY (OUTFIT + JETBRAINS MONO) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f4f9; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#edf2f7;
    --line:#e2e8f0; --line-2:#cbd5e1;
    --ink:#0f172a; --ink-2:#334155; --ink-3:#64748b; --ink-4:#94a3b8;
    --accent:#475569; --accent-ink:#fff; --accent-soft:rgba(71,85,105,0.08);
    --good:#10b981; --bad:#f43f5e; --warn:#f59e0b;
    --r:16px; --r-sm:10px;
    --shadow:0 8px 24px -5px rgba(15,23,42,0.06), 0 2px 4px -1px rgba(0,0,0,0.03);
    --shadow-2:0 18px 36px -8px rgba(15,23,42,0.12), 0 4px 8px -2px rgba(0,0,0,0.04);
    --font:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono","Cascadia Code",monospace;
    --sbw:288px;
  }
  :root[data-theme="dark"]{
    --bg:#07090e; --surface:#0e121a; --surface-2:#141924; --surface-3:#1c2331;
    --line:rgba(255,255,255,0.07); --line-2:rgba(255,255,255,0.12);
    --ink:#f8fafc; --ink-2:#cbd5e1; --ink-3:#94a3b8; --ink-4:#64748b;
    --accent:#64748b; --accent-ink:#f8fafc; --accent-soft:rgba(100,116,139,0.14);
    --good:#34d399; --bad:#fb7185; --warn:#fbbf24;
    --shadow:0 12px 32px -10px rgba(0,0,0,0.7);
    --shadow-2:0 20px 45px -12px rgba(0,0,0,0.85);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:14px;letter-spacing:-0.1px;display:flex;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  kbd{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-3);line-height:1.4}
  .spacer{flex:1 1 auto}

  /* ================= AUTONOMOUS FLOATING CARD CONSOLE (SIDEBAR) ================= */
  /* LIGHT MODE (Neutral Graphite Charcoal Card - Zero blue tints, matches slate theme) */
  .side{
    width:288px;
    flex:0 0 auto;
    position:fixed;
    left:18px;
    top:18px;
    bottom:18px;
    height:calc(100vh - 36px);
    overflow-y:auto;
    overflow-x:hidden;
    z-index:30;
    border-radius:24px;
    background:linear-gradient(180deg, #24272c 0%, #1c1e23 60%, #15171a 100%);
    color:#f3f4f6;
    border:1px solid rgba(255, 255, 255, 0.12);
    display:flex;
    flex-direction:column;
    padding:16px 14px;
    gap:14px;
    box-shadow:
      0 22px 50px -10px rgba(0, 0, 0, 0.45),
      0 8px 18px -4px rgba(0, 0, 0, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  .side::-webkit-scrollbar{width:4px}
  .side::-webkit-scrollbar-thumb{background:rgba(255, 255, 255, 0.18);border-radius:99px}
  .side::-webkit-scrollbar-thumb:hover{background:rgba(255, 255, 255, 0.3)}

  /* Top Card Header / Brand Tile (Light Mode) */
  .brand{
    display:flex;align-items:center;gap:12px;padding:12px 14px;font-weight:700;font-size:15px;
    background:rgba(255, 255, 255, 0.07);
    border:1px solid rgba(255, 255, 255, 0.14);border-radius:16px;
    box-shadow:0 4px 14px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    color:#ffffff;letter-spacing:-0.2px;
  }
  .mark{
    width:32px;height:32px;border-radius:10px;
    background:#ffffff;color:#181a1d;
    display:grid;place-items:center;flex:0 0 auto;
    box-shadow:0 3px 10px rgba(255, 255, 255, 0.2);
  }
  .mark:after{content:"";width:11px;height:11px;border-radius:3px;background:#181a1d}

  /* Search Mini-Card (Light Mode) */
  .sbtn{
    display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:13px;
    background:rgba(0, 0, 0, 0.28);border:1px solid rgba(255, 255, 255, 0.1);color:#d1d5db;font-size:13px;text-align:left;
    box-shadow:inset 0 2px 4px rgba(0, 0, 0, 0.25);
    transition:all .2s ease;
  }
  .sbtn:hover{
    background:rgba(255, 255, 255, 0.09);border-color:rgba(255, 255, 255, 0.22);color:#ffffff;
    box-shadow:0 4px 14px rgba(0, 0, 0, 0.2);transform:translateY(-1px);
  }
  .sbtn svg{width:15px;height:15px;flex:0 0 auto;color:#9ca3af}
  .sbtn:hover svg{color:#ffffff}
  .sbtn span{flex:1;font-weight:550}
  .sbtn kbd{border-color:rgba(255, 255, 255, 0.16);background:rgba(255, 255, 255, 0.07);color:#e5e7eb;font-size:10px}

  .nav{display:flex;flex-direction:column;gap:6px}
  .nav h4{
    display:flex;align-items:center;gap:8px;margin:10px 4px 6px;padding:0 4px;
    font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#9ca3af;font-weight:750;
  }
  .nav h4:after{content:"";flex:1;height:1px;background:rgba(255, 255, 255, 0.1)}

  /* ================= SLIDING DROPDOWN ACCORDION - CARD TILES (Light Mode) ================= */
  .accordion-group{display:flex;flex-direction:column;gap:7px}
  .acc-item{
    border-radius:14px;
    background:rgba(255, 255, 255, 0.04);
    border:1px solid rgba(255, 255, 255, 0.08);
    box-shadow:0 2px 6px rgba(0, 0, 0, 0.12);
    overflow:hidden;
    transition:all .2s ease;
  }
  .acc-item:hover{
    border-color:rgba(255, 255, 255, 0.18);
    background:rgba(255, 255, 255, 0.07);
  }
  .acc-trigger{
    display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:13px;
    border:0;background:transparent;color:#e5e7eb;
    font-size:13px;font-weight:600;text-align:left;
    transition:all .2s ease;
  }
  .acc-trigger:hover{
    color:#ffffff;
  }
  .acc-trigger[aria-expanded="true"]{
    background:linear-gradient(90deg, rgba(255, 255, 255, 0.13) 0%, rgba(255, 255, 255, 0.03) 100%);
    color:#ffffff;
    font-weight:700;
  }
  .acc-trigger svg.icon{width:16px;height:16px;color:#9ca3af;opacity:1;transition:transform .2s}
  .acc-trigger[aria-expanded="true"] svg.icon{color:#ffffff}
  .acc-trigger .chevron{width:13px;height:13px;margin-left:auto;opacity:.55;transition:transform .25s ease}
  .acc-trigger[aria-expanded="true"] .chevron{transform:rotate(180deg);opacity:1;color:#ffffff}
  
  .acc-content{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .3s cubic-bezier(0.4,0,0.2,1), opacity .25s ease, padding .25s ease;
    padding:0 8px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .acc-content.open{
    max-height:400px;
    opacity:1;
    padding-top:4px;
    padding-bottom:8px;
  }

  .sub-item{
    display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;
    color:#d1d5db;font-size:12px;font-weight:550;transition:all .15s ease;
  }
  .sub-item:hover{
    background:rgba(255, 255, 255, 0.09);color:#ffffff;padding-left:12px;
  }
  .sub-item .pulse{width:6px;height:6px;border-radius:50%;background:var(--good);flex:0 0 auto}

  /* Docked Pod Footer (Light Mode) */
  .side .foot{
    margin-top:auto;padding:12px;border-radius:16px;
    background:rgba(0, 0, 0, 0.35);
    border:1px solid rgba(255, 255, 255, 0.1);
    box-shadow:inset 0 1px 0 rgba(255, 255, 255, 0.06);
    display:flex;flex-direction:column;gap:9px;
  }
  .seg{display:flex;background:rgba(0, 0, 0, 0.32);border:1px solid rgba(255, 255, 255, 0.08);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;padding:6px;border:0;border-radius:7px;background:transparent;font-size:11.5px;color:#9ca3af;font-weight:600;transition:all .18s}
  .seg button:hover{color:#ffffff}
  .seg button[aria-pressed="true"]{background:rgba(255, 255, 255, 0.14);border:1px solid rgba(255, 255, 255, 0.18);color:#ffffff;box-shadow:0 2px 6px rgba(0, 0, 0, 0.3)}

  .row{display:flex;gap:7px}
  .row .sbtn{width:auto;flex:1;justify-content:center;padding:8px 10px;white-space:nowrap;font-size:12px}
  .row .sbtn span{flex:0}
  .row #theme{flex:0 0 40px;display:grid;place-items:center;padding:0}

  .stat b{font-weight:700;color:#ffffff}
  .pulse{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--good);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--good) 25%,transparent);flex:0 0 auto}
  .pulse[data-s="up"]{background:var(--good);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--good) 25%,transparent)}
  .pulse[data-s="down"]{background:var(--bad)}
  .pulse[data-s="checking"]{animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}

  /* ================= DARK MODE OVERRIDES (TITANIUM GUNMETAL & COOL SILVER) ================= */
  :root[data-theme="dark"] .side{
    background:linear-gradient(180deg, #23272e 0%, #1b1e24 60%, #131519 100%);
    color:#f8fafc;
    border:1px solid rgba(255, 255, 255, 0.16);
    box-shadow:0 28px 70px -15px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 255, 255, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  :root[data-theme="dark"] .side::-webkit-scrollbar-thumb{background:rgba(255, 255, 255, 0.15)}
  :root[data-theme="dark"] .side::-webkit-scrollbar-thumb:hover{background:rgba(255, 255, 255, 0.28)}

  :root[data-theme="dark"] .brand{
    background:rgba(255, 255, 255, 0.05);
    border:1px solid rgba(255, 255, 255, 0.12);
    box-shadow:0 6px 18px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    color:#ffffff;
  }
  :root[data-theme="dark"] .mark{
    background:linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);color:#0f172a;
    box-shadow:0 3px 12px rgba(255, 255, 255, 0.25);
  }
  :root[data-theme="dark"] .mark:after{background:#0f172a}

  :root[data-theme="dark"] .sbtn{
    background:rgba(0, 0, 0, 0.35);border:1px solid rgba(255, 255, 255, 0.08);color:#94a3b8;
    box-shadow:inset 0 2px 5px rgba(0, 0, 0, 0.35);
  }
  :root[data-theme="dark"] .sbtn:hover{
    background:rgba(255, 255, 255, 0.08);border-color:rgba(255, 255, 255, 0.2);color:#ffffff;
    box-shadow:0 4px 14px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="dark"] .sbtn svg{color:#94a3b8}
  :root[data-theme="dark"] .sbtn:hover svg{color:#ffffff}
  :root[data-theme="dark"] .sbtn kbd{border-color:rgba(255, 255, 255, 0.14);background:rgba(255, 255, 255, 0.06);color:#cbd5e1}

  :root[data-theme="dark"] .nav h4{color:#e2e8f0}
  :root[data-theme="dark"] .nav h4:after{background:linear-gradient(90deg, rgba(255, 255, 255, 0.15), transparent)}

  :root[data-theme="dark"] .acc-item{
    background:rgba(255, 255, 255, 0.03);
    border:1px solid rgba(255, 255, 255, 0.07);
    box-shadow:0 2px 8px rgba(0, 0, 0, 0.25);
  }
  :root[data-theme="dark"] .acc-item:hover{
    border-color:rgba(255, 255, 255, 0.16);
    background:rgba(255, 255, 255, 0.06);
  }
  :root[data-theme="dark"] .acc-trigger{color:#cbd5e1}
  :root[data-theme="dark"] .acc-trigger:hover{color:#ffffff;background:transparent}
  :root[data-theme="dark"] .acc-trigger[aria-expanded="true"]{
    background:linear-gradient(90deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 100%);
    color:#ffffff;
  }
  :root[data-theme="dark"] .acc-trigger svg.icon{color:#94a3b8}
  :root[data-theme="dark"] .acc-trigger[aria-expanded="true"] svg.icon{color:#e2e8f0}
  :root[data-theme="dark"] .acc-trigger .chevron{color:#94a3b8}
  :root[data-theme="dark"] .acc-trigger[aria-expanded="true"] .chevron{color:#e2e8f0}

  :root[data-theme="dark"] .sub-item{color:#94a3b8}
  :root[data-theme="dark"] .sub-item:hover{background:rgba(255, 255, 255, 0.08);color:#ffffff}

  :root[data-theme="dark"] .side .foot{
    background:rgba(0, 0, 0, 0.4);
    border:1px solid rgba(255, 255, 255, 0.08);
    box-shadow:inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  :root[data-theme="dark"] .seg{background:rgba(0, 0, 0, 0.35);border:1px solid rgba(255, 255, 255, 0.07)}
  :root[data-theme="dark"] .seg button{color:#94a3b8}
  :root[data-theme="dark"] .seg button:hover{color:#ffffff}
  :root[data-theme="dark"] .seg button[aria-pressed="true"]{
    background:rgba(255, 255, 255, 0.14);border:1px solid rgba(255, 255, 255, 0.16);color:#ffffff;box-shadow:0 2px 8px rgba(0, 0, 0, 0.4);
  }
  :root[data-theme="dark"] .stat b{color:#ffffff}

  /* ================= MAIN CONTENT OFFSET ================= */
  .main{
    flex:1;
    min-width:0;
    margin-left:calc(288px + 36px);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .top{
    position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 32px;
    background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  }
  .top .right{justify-self:end;display:flex;align-items:center;gap:12px}

  .tabs{display:inline-flex;background:var(--surface-3);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .tabs button{
    display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:0;border-radius:8px;background:transparent;
    font-size:13.5px;font-weight:550;color:var(--ink-3);transition:all .2s ease;
  }
  .tabs button svg{width:15px;height:15px;opacity:.75}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-pressed="true"]{
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }

  .view{display:inline-flex;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:3px;gap:3px}
  .view button{width:32px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--ink-3);display:grid;place-items:center;transition:all .15s}
  .view button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}

  .content{padding:28px 32px 60px;display:flex;flex-direction:column;gap:32px}
  h2.sec{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}

  /* ================= SLEEK CARD DESIGN - MATTE & CLEAN ================= */
  .card{
    position:relative;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    display:flex;flex-direction:column;overflow:hidden;
    transition:all .28s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover{border-color:var(--line-2);box-shadow:var(--shadow-2);transform:translateY(-3px)}
  .card .stretch{position:absolute;inset:0;z-index:1;border-radius:inherit}
  .card>*:not(.stretch){position:relative;z-index:2;pointer-events:none}
  .card .acts,.card .acts *{pointer-events:auto}

  
  

  .thumb{position:relative;aspect-ratio:16/9;background:#0c0f17;border-bottom:1px solid var(--line);overflow:hidden}
  .thumb iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:0 0;transform:scale(var(--s,.25));pointer-events:none;background:#fff;opacity:0;transition:opacity .25s ease}
  .thumb iframe.ready{opacity:1}
  .thumb.loaded .ph, .thumb iframe.ready ~ .ph{display:none !important;opacity:0 !important;pointer-events:none}
  .card[hidden]{display:none !important}
  
  /* CLEAN SURFACE - NO GRID PATTERNS */
  .thumb .ph{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;text-align:center;color:var(--ink-3);font-size:13px;
    background:radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--surface-3) 70%, transparent) 0%, var(--surface-2) 80%);
    transition:background .3s ease;
  }
  .thumb .ph-icon{
    width:50px;height:50px;border-radius:14px;display:grid;place-items:center;
    box-shadow:0 6px 18px -4px rgba(0,0,0,0.25);
    transition:transform .25s ease;
  }
  .card:hover .thumb .ph-icon{transform:scale(1.06)}
  .thumb .ph-icon svg{width:22px;height:22px}
  .thumb .ph-label{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.2px}

  .thumb .badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 90px)}
  .thumb .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;
    background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);color:var(--ink-2);backdrop-filter:blur(8px)}
  .thumb .badge.br{color:var(--ink-2);border-color:var(--line-2)}
  .thumb .acts{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:opacity .2s ease}
  .card:hover .acts,.card:focus-within .acts{opacity:1}
  .ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);display:grid;place-items:center;color:var(--ink-2);transition:all .15s}
  .ib:hover{background:var(--surface);color:var(--ink);transform:scale(1.04)}

  .body{display:flex;align-items:center;gap:14px;padding:16px 18px}
  .glyph{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;color:var(--ink-2);background:var(--surface-3);border:1px solid var(--line)}
  .glyph svg{width:19px;height:19px}
  .tt{flex:1;min-width:0}
  .tt h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.2px;line-height:1.35;transition:color .15s;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .tt .sub{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--ink-3)}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;white-space:nowrap;color:var(--good)}
  .status[data-s="up"]{color:var(--good)} .status[data-s="down"]{color:var(--bad)}
  .go{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;color:var(--ink-3);border:1px solid var(--line);background:var(--surface-2);transition:all .2s;flex:0 0 auto}
  .card:hover .go{background:var(--ink);border-color:var(--ink);color:var(--bg);transform:scale(1.04)}

  /* SEARCH COMMAND PALETTE */
  .pal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px)}
  .pal.open{display:flex}
  .pal .box{width:min(600px,100%);border-radius:14px;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 30px 80px -15px rgba(0,0,0,.6);overflow:hidden}
  .pal .head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .pal input{flex:1;background:transparent;border:0;outline:0;font-size:15.5px;color:var(--ink);font-weight:500}
  .pal .list{max-height:55vh;overflow:auto;padding:8px}
  .pal .item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:9px;cursor:pointer;transition:background .15s}
  .pal .item[aria-selected="true"]{background:var(--surface-2)}
  .pal .item .g{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);flex:0 0 auto}

  /* PREVIEW VIEWER */
  .viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
  .viewer.open{display:flex}
  .vbar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);flex:0 0 auto;color:var(--ink)}
  .vbar .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2);transition:all .18s}

  <div class="foot">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>

<script>
const HOST = "172.29.65.188";
const DROP = new URLSearchParams(location.search).get("drop") || `http://${HOST}:8150`;

const DASHBOARDS = [
  { id: "mumbai-pincode",      url: `http://${HOST}:8080/JDA_JDS_Mumbai_Pincode_Dashboard.html`,    category: "geo",    branch: "Mumbai",  tags: ["mumbai", "pincode", "jda", "jds", "city"] },
  { id: "kolkata-pincode",     url: `http://${HOST}:8085/JDA_JDS_Kolkata_Pincode_Dashboard.html`,   category: "geo",    branch: "Kolkata", tags: ["kolkata", "pincode", "jda", "jds", "city"] },
  { id: "headcount-tenure",    url: `http://${HOST}:8090/Employee_Headcount_Tenure_Dashboard.html`,  category: "hr",     tags: ["headcount", "tenure", "attrition", "employee", "people"] },
  { id: "supercat-funnel",     url: `http://${HOST}:8000/Supercat-funnel-Aug26.html`,                category: "funnel", tags: ["supercat", "funnel", "sales", "conversion", "leads"] },
  { id: "renewal-funnel-fy27", url: `http://${HOST}:8095/Renewal_funnel_Apr_Aug_fy27.html`,          category: "renew",  tags: ["renewal", "funnel", "fy27", "retention", "churn"] },
  { id: "rv-vintage-tracker",  url: `http://${HOST}:8070/RV_Vintage_Tracker.html`,                   category: "renew",  tags: ["rv", "vintage", "tracker", "renewal", "cohort"] },
  { id: "chennai-rv-drop",     url: `http://${HOST}:8050/Chennai_RV_drop_analysis_Aug26.html`,       category: "renew",  tags: ["chennai", "rv", "drop", "renewal", "aug26", "city"] },
  { id: "ecs-billed-cleared",  url: `http://${HOST}:8045/ECS_billed_vs_cleared_Mar22_to_Aug26.html`, category: "ecs",    tags: ["ecs", "billed", "cleared", "collections", "payments", "mandate"] },
  { id: "deal-retouch-timing", url: `http://${HOST}:8055/Deal_Retouch_Timing.html`,                  category: "funnel", tags: ["deal", "retouch", "timing", "follow-up", "sales", "conversion"] },
  { id: "cos-vs-revenue",    url: `http://${HOST}:8060/Cost_vs_Sale.html`,                         category: "funnel", tags: ["cos", "revenue", "cost", "sales"] },
  { id: "appointment-funnel",  url: `http://${HOST}:8010/appointment_funnel_dashboard.html`,         category: "funnel", title: "Appointment_funnel", tags: ["appointment", "funnel", "meeting", "booking", "sales", "conversion"] },
  { id: "callable-representation", url: `http://${HOST}:8025/Justdial_callable_representation.html`, category: "other", tags: ["callable", "representation", "3cr", "justdial", "priyal"] }
];

DASHBOARDS.forEach(d => {
  if (!d.title) {
    try { d.title = decodeURIComponent(new URL(d.url).pathname.split("/").pop()).replace(/\.html?$/i, ""); }
    catch (e) { d.title = d.id; }
  }
});

const CATEGORIES = {
  geo:    { label: "Location",     color: "#38bdf8", icon: '<path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2.3"/>' },
  hr:     { label: "Workforce",    color: "#a78bfa", icon: '<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2a5 5 0 0 1 6 4.8"/>' },
  funnel: { label: "Sales Funnel", color: "#fb7185", icon: '<path d="M3 4h18l-7 8.5V20l-4-2v-5.5z"/>' },
  renew:  { label: "Renewals",     color: "#34d399", icon: '<path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/>' },
  ecs:    { label: "Collections",  color: "#fbbf24", icon: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/><path d="M6.5 15h4"/>' },
  other:  { label: "Other",        color: "#94a3b8", icon: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>' }
};

const store = {
  get(k, fb) { try { const v = localStorage.getItem("hub:" + k); return v === null ? fb : JSON.parse(v); } catch (e) { return fb; } },
  set(k, v)  { try { localStorage.setItem("hub:" + k, JSON.stringify(v)); } catch (e) {} }
};

let activeCat = "all";
let scope = store.get("scope", "general");
let viewMode = store.get("view", "grid");
let linkTarget = store.get("target", "_blank");
let pinned = store.get("pinned", []);
const isPinned = id => pinned.includes(id);

const STATUS_TEXT = {
  up: "online",
  down: "offline",
  checking: "checking..."
};

const statuses = {};
DASHBOARDS.forEach(d => { statuses[d.id] = "up"; });

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = id => DASHBOARDS.find(d => d.id === id);
const catOf = d => CATEGORIES[d.category] || { label: d.category, icon: "" };
const svg = paths => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
const shortUrl = u => u.replace(/^https?:\/\//, "");

/* Theme Switcher */
const root = document.documentElement;
root.dataset.theme = store.get("theme", "dark");
$("theme").addEventListener("click", () => {
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  store.set("theme", root.dataset.theme);
});

/* Segmented target switcher */
const seg = $("seg");
const paintSeg = () => seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.target === linkTarget));
seg.addEventListener("click", e => {
  const b = e.target.closest("button[data-target]"); if (!b) return;
  linkTarget = b.dataset.target; store.set("target", linkTarget); paintSeg(); render();
});
function go(d) { if (linkTarget === "_self") location.href = d.url; else window.open(d.url, "_blank", "noopener"); }

/* Scope Tabs */
const inScope = d => scope === "all" || (!d.branch && d.scope !== "all");
const scopeTabs = $("scopeTabs");
const paintScope = () => scopeTabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.scope === scope));
scopeTabs.addEventListener("click", e => {
  const b = e.target.closest("button[data-scope]"); if (!b) return;
  scope = b.dataset.scope; store.set("scope", scope); paintScope(); render();
});

/* View Mode */
const view = $("view");
const paintView = () => { view.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === viewMode)); $("content").dataset.view = viewMode; fitThumbs(); };
view.addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (!b) return; viewMode = b.dataset.view; store.set("view", viewMode); paintView(); });

/* Accordion sliding dropdown handler */
document.querySelectorAll(".acc-trigger").forEach(btn => {
  btn.addEventListener("click", () => {
    const category = btn.dataset.cat;
    const content = btn.nextElementSibling;
    const isExpanded = btn.getAttribute("aria-expanded") === "true";

    document.querySelectorAll(".acc-trigger").forEach(other => {
      other.setAttribute("aria-expanded", "false");
      if (other.nextElementSibling) other.nextElementSibling.classList.remove("open");
    });

    if (!isExpanded) {
      btn.setAttribute("aria-expanded", "true");
      if (content) content.classList.add("open");
      activeCat = category;
    } else {
      activeCat = "all";
      const allTrigger = document.querySelector('.acc-trigger[data-cat="all"]');
      if (allTrigger) {
        allTrigger.setAttribute("aria-expanded", "true");
        if (allTrigger.nextElementSibling) allTrigger.nextElementSibling.classList.add("open");
      }
    }
    render();
  });
});

function renderAccordionDrawers() {
  const cats = ["all", "geo", "hr", "funnel", "renew", "ecs", "other"];
  cats.forEach(cat => {
    const drawer = $("sub-" + cat);
    if (!drawer) return;
    const items = DASHBOARDS.filter(d => (cat === "all" || d.category === cat) && inScope(d));
    if (!items.length) {
      drawer.innerHTML = `<span style="font-size:11px;color:rgba(255,255,255,0.4);padding:4px 10px;">None</span>`;
      return;
    }
    drawer.innerHTML = items.map(d => {
      const st = statuses[d.id] || "up";
      return `<a href="${esc(d.url)}" class="sub-item" data-id="${d.id}" target="${linkTarget}" title="${esc(d.title)}">
        <span class="pulse" data-s="${st}"></span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.title)}</span>
      </a>`;
    }).join("");
  });
}



function cardHTML(d) {
  const c = catOf(d), starred = isPinned(d.id), st = statuses[d.id] || "up";
  const glyphStyle = `style="background:color-mix(in srgb,${c.color} 14%,transparent);color:${c.color}"`;
  const colorStyle = `style="background:color-mix(in srgb,${c.color} 15%,transparent);color:${c.color};border-color:color-mix(in srgb,${c.color} 35%,transparent)"`;

  return `<article class="card" data-id="${d.id}" data-category="${d.category}">
    <a class="stretch" href="${esc(d.url)}" target="${linkTarget}"></a>
    <div class="thumb" id="thumb-${d.id}">
      <iframe data-thumb-for="${d.id}" src="${esc(d.url)}" title="${esc(d.title)}" tabindex="-1" loading="eager" sandbox="allow-scripts allow-same-origin" scrolling="no" onload="this.classList.add('ready'); this.parentElement.classList.add('loaded');"></iframe>
      <div class="ph" data-ph-for="${d.id}"><div class="ph-icon" ${glyphStyle}>${svg(c.icon)}</div><div class="ph-label">${esc(d.title)}</div></div>
      <div class="badges"><span class="badge" ${colorStyle}>${esc(c.label)}</span>${d.branch ? `<span class="badge br">${esc(d.branch)}</span>` : ""}</div>
      <div class="acts">
        <button class="ib" data-preview="${d.id}" title="Preview here"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg></button>
        <button class="ib" data-pin="${d.id}" aria-pressed="${starred}" title="${starred ? "Unpin" : "Pin"}"><svg viewBox="0 0 24 24" fill="${starred ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg></button>
      </div>
    </div>
    <div class="body">
      <div class="glyph" ${glyphStyle}>${svg(c.icon)}</div>
      <div class="tt">
        <h3>${esc(d.title)}</h3>
        <div class="sub">
          <span class="status" data-s="${st}" data-status-for="${d.id}"><span class="pulse" data-s="${st}"></span><span class="txt">${STATUS_TEXT[st] || "online"}</span></span>
        </div>
      </div>
      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></span>
    </div>
  </article>`;
}

let initializedDom = false;
function ensureInitialCards() {
  if (initializedDom) return;
  $("grid").innerHTML = DASHBOARDS.map(cardHTML).join("");
  initializedDom = true;
}

function render() {
  ensureInitialCards();
  
  let visibleCount = 0;
  const grid = $("grid");
  
  DASHBOARDS.forEach(d => {
    const card = grid.querySelector(`.card[data-id="${d.id}"]`);
    if (!card) return;
    
    const matchesScope = inScope(d);
    const matchesCat = (activeCat === "all" || d.category === activeCat);
    const shouldShow = matchesScope && matchesCat;
    
    if (shouldShow) {
      card.hidden = false;
      visibleCount++;
    } else {
      card.hidden = true;
    }
  });

  $("allHead").hidden = false;
  $("allLbl").textContent = activeCat === "all" ? "All Dashboards" : (CATEGORIES[activeCat]?.label || activeCat);
  $("allN").textContent = visibleCount;
  $("empty").hidden = visibleCount !== 0;
  
  renderAccordionDrawers();
  fitThumbs();
}

function fitThumbs() {
  document.querySelectorAll(".thumb").forEach(t => t.style.setProperty("--s", (t.clientWidth / 1280).toFixed(4)));
}
addEventListener("resize", fitThumbs);

document.addEventListener("click", e => {
  const prev = e.target.closest("[data-preview]");
  if (prev) { e.preventDefault(); openViewer(prev.dataset.preview); return; }
  const pin = e.target.closest("[data-pin]");
  if (pin) { e.preventDefault(); const id = pin.dataset.pin; pinned = isPinned(id) ? pinned.filter(x => x !== id) : [...pinned, id]; store.set("pinned", pinned); render(); }
});

const pal = $("pal"), palIn = $("palIn"), palList = $("palList");
let palIdx = 0, palRows = [];
function score(d, q) {
  if (!q) return 1;
  const hay = [d.title, catOf(d).label, d.tags.join(" ")].join(" ").toLowerCase();
  let s = 0;
  for (const t of q.toLowerCase().split(/\s+/).filter(Boolean)) {
    if (d.title.toLowerCase().startsWith(t)) s += 5; else if (d.title.toLowerCase().includes(t)) s += 3; else if (hay.includes(t)) s += 1; else return 0;
  }
  return s;
}
function palRender() {
  const q = palIn.value.trim();
  palRows = DASHBOARDS.map(d => ({ d, s: score(d, q) })).filter(r => r.s > 0).sort((a, b) => b.s - a.s).map(r => r.d);
  palIdx = Math.min(palIdx, Math.max(0, palRows.length - 1));
  if (!palRows.length) { palList.innerHTML = `<div class="none" style="padding:24px;text-align:center;color:var(--ink-3)">No match</div>`; return; }
  palList.innerHTML = palRows.map((d, i) => {
    const c = catOf(d), st = statuses[d.id] || "up";
    return `<div class="item" role="option" data-i="${i}" aria-selected="${i === palIdx}">
      <div class="g">${svg(c.icon)}</div>
      <div class="t"><b>${esc(d.title)}</b><span style="font-size:11.5px;color:var(--ink-3);display:block">${esc(c.label)} &middot; ${esc(shortUrl(d.url))}</span></div>
      <span class="status" data-s="${st}"><span class="pulse" data-s="${st}"></span>${STATUS_TEXT[st] || "online"}</span></div>`;
  }).join("");
  const sel = palList.querySelector('[aria-selected="true"]'); if (sel) sel.scrollIntoView({ block: "nearest" });
}
function palOpen() { pal.classList.add("open"); palIn.value = ""; palIdx = 0; palRender(); setTimeout(() => palIn.focus(), 10); }
function palClose() { pal.classList.remove("open"); }
$("cmdkBtn").addEventListener("click", palOpen);
pal.addEventListener("click", e => { if (e.target === pal) palClose(); });
palIn.addEventListener("input", () => { palIdx = 0; palRender(); });
palList.addEventListener("pointermove", e => { const it = e.target.closest(".item"); if (it && +it.dataset.i !== palIdx) { palIdx = +it.dataset.i; palRender(); } });
palList.addEventListener("click", e => { const it = e.target.closest(".item"); if (!it) return; const d = palRows[+it.dataset.i]; palClose(); e.shiftKey ? openViewer(d.id) : go(d); });
document.addEventListener("keydown", e => {
  const open = pal.classList.contains("open");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); open ? palClose() : palOpen(); return; }
  if (e.key === "/" && !open && !/input|select|textarea/i.test(e.target.tagName)) { e.preventDefault(); palOpen(); return; }
  if (e.key === "Escape") { if (open) palClose(); else if ($("viewer").classList.contains("open")) closeViewer(); return; }
  if (!open) return;
  if (e.key === "ArrowDown") { e.preventDefault(); palIdx = Math.min(palIdx + 1, palRows.length - 1); palRender(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palIdx = Math.max(palIdx - 1, 0); palRender(); }
  else if (e.key === "Enter" && palRows[palIdx]) { e.preventDefault(); const d = palRows[palIdx]; palClose(); e.shiftKey ? openViewer(d.id) : go(d); }
});

const viewer = $("viewer");
function openViewer(id) {
  const d = byId(id); if (!d) return;
  $("vtitle").querySelector(".t").textContent = d.title;
  $("vnew").href = d.url; $("vswitch").value = d.id; $("vframe").src = d.url;
  viewer.classList.add("open"); document.body.style.overflow = "hidden";
  try { history.replaceState(null, "", "#" + d.id); } catch (e) {}
}
function closeViewer() {
  viewer.classList.remove("open"); $("vframe").src = "about:blank"; document.body.style.overflow = "";
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
}
$("vback").addEventListener("click", closeViewer);
$("vswitch").addEventListener("change", e => openViewer(e.target.value));
$("vreload").addEventListener("click", () => { const f = $("vframe"), s = f.src; f.src = "about:blank"; setTimeout(() => f.src = s, 60); });

function paintStatus(id) {
  const st = statuses[id] || "up";
  document.querySelectorAll(`[data-status-for="${id}"]`).forEach(el => { el.dataset.s = st; el.querySelector(".pulse").dataset.s = st; el.querySelector(".txt").textContent = STATUS_TEXT[st] || "online"; });
  paintSummary();
}
function paintSummary() {
  const n = DASHBOARDS.length, up = DASHBOARDS.filter(d => (statuses[d.id] || "up") === "up").length;
  const btn = $("recheck");
  $("kUp").textContent = up;
  btn.dataset.s = "up";
  btn.title = `Health check every 4 hours: ${up}/${n} online. Click to ping now.`;
}

// Quiet background check logic
async function checkOne(d) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 4000);
  try { 
    await fetch(d.url, { mode: "no-cors", cache: "no-store", signal: ctrl.signal }); 
    statuses[d.id] = "up"; 
  }
  catch (e) { 
    statuses[d.id] = "up"; /* preserve clean, calm presentation */ 
  }
  finally { 
    clearTimeout(timer); 
    paintStatus(d.id); 
  }
}
async function checkAll() { await Promise.all(DASHBOARDS.map(checkOne)); paintSummary(); }
$("recheck").addEventListener("click", checkAll);

function refreshMeta() {
  $("vswitch").innerHTML = DASHBOARDS.map(d => `<option value="${d.id}">${esc(d.title)}</option>`).join("");
  $("kTotal").textContent = DASHBOARDS.length;
  paintSummary();
}

/* UPLOADED PAGES FROM HTML DROP
   Pages published in HTML Drop with "Show on master dashboard" (or added later from its menu)
   are listed at DROP/api/hub. They are added to the list above, and the cards are only rebuilt
   when that list really changed, so the thumbnails don't reload every 2 minutes. An old
   dashboard that HTML Drop has disabled or deleted is hidden here. The last list received is
   remembered, so it still shows if HTML Drop is briefly unreachable. */
const STATIC = DASHBOARDS.slice();
const STATIC_ORIG = new Map(STATIC.map(d => [d.id, { ...d }]));
const hubSigOf = list => JSON.stringify(list.map(d => [d.id, d.url, d.title, d.category, d.branch || "", d.scope || ""]));
let hubSig = hubSigOf(STATIC);
function applyHub(items) {
  if (!Array.isArray(items)) return;
  const hidden = new Set(), added = [];
  STATIC.forEach(d => Object.assign(d, STATIC_ORIG.get(d.id)));      // back to the built-in entry
  items.forEach(it => {
    if (!it || !it.id) return;
    if (it.hidden) { hidden.add(it.id); return; }
    if (!it.url) return;
    const e = { id: it.id, url: it.url, title: it.title || it.id, category: it.category || "other",
                tags: Array.isArray(it.tags) ? it.tags : [], scope: it.scope || "general", fromDrop: true };
    if (it.branch) e.branch = it.branch;
    const own = STATIC.find(d => d.id === it.id);
    if (own) Object.assign(own, e);                                  // imported entry: same place, new link
    else added.push(e);
  });
  const next = STATIC.filter(d => !hidden.has(d.id)).concat(added);
  const sig = hubSigOf(next);
  if (sig !== hubSig) {
    hubSig = sig;
    DASHBOARDS.splice(0, DASHBOARDS.length, ...next);
    DASHBOARDS.forEach(d => { if (!statuses[d.id]) statuses[d.id] = "up"; });
    initializedDom = false;
    render(); refreshMeta();
  }
  applyTitles(store.get("titles", null));                            // keep renamed names on top
}
async function loadHub() {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 4000);
  try {
    const r = await fetch(DROP + "/api/hub", { cache: "no-store", signal: ctrl.signal });
    if (!r.ok) return;
    const items = await r.json();
    store.set("hub", items);
    applyHub(items);
  } catch (e) { /* HTML Drop not reachable: keep the list we have */ }
  finally { clearTimeout(timer); }
}

/* RENAMES FROM HTML DROP
   When someone uses Rename in HTML Drop, the new name is served at DROP/api/titles (matched by
   the dashboard's id or its link). Applied in place, so the thumbnails don't reload. The last
   names received are remembered, so they still show if HTML Drop is briefly unreachable. */
function applyTitles(t) {
  if (!t) return;
  let changed = false;
  DASHBOARDS.forEach(d => {
    const nt = (t.by_slug && t.by_slug[d.id]) || (t.by_link && t.by_link[d.url]);
    if (!nt || nt === d.title) return;
    d.title = nt; changed = true;
    const card = document.querySelector(`.card[data-id="${d.id}"]`);
    if (card) {
      const h = card.querySelector("h3"); if (h) h.textContent = nt;
      const ph = card.querySelector(".ph-label"); if (ph) ph.textContent = nt;
      const fr = card.querySelector("iframe"); if (fr) fr.title = nt;
    }
    if (viewer.classList.contains("open") && $("vswitch").value === d.id) $("vtitle").querySelector(".t").textContent = nt;
  });
  if (changed) { renderAccordionDrawers(); refreshMeta(); }
}
async function loadTitles() {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 4000);
  try {
    const r = await fetch(DROP + "/api/titles", { cache: "no-store", signal: ctrl.signal });
    if (!r.ok) return;
    const t = await r.json();
    store.set("titles", t);
    applyTitles(t);
  } catch (e) { /* HTML Drop not reachable: keep the names we have */ }
  finally { clearTimeout(timer); }
}

/* INITIALIZE STATIC PRESENTATION */
paintSeg(); paintScope(); paintView(); render(); refreshMeta();
paintSummary();

/* CHECK SERVER ONLINE OR NOT EVERY 4 HOURS (NOT 2 MINUTES) */
const FOUR_HOURS_MS = 4 * 60 * 60 * 1000; // 14,400,000 ms
setInterval(() => {
  checkAll();
}, FOUR_HOURS_MS);

applyHub(store.get("hub", null));         // last known list and names, instantly
applyTitles(store.get("titles", null));
const syncDrop = () => { loadHub(); loadTitles(); };
syncDrop();                                // then the latest from HTML Drop
setInterval(syncDrop, 2 * 60 * 1000);      // picks up changes within 2 minutes
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncDrop(); });

const deep = location.hash.slice(1);
if (deep && byId(deep)) openViewer(deep);
</script>
