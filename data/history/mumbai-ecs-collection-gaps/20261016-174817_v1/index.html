<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mumbai ME ECS Collection Tracker</title>
<style>

:root{
  color-scheme: light;
  --bg:#f6f6f4; --surface:#fcfcfb; --line:#e3e2dd; --grid:#ecebe7;
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#7b7a75;
  --s1:#2a78d6; --s1-soft:#cde2fb; --s2:#8a8984; --s3:#eb6834; --s4:#1baf7a; --o-soft:#f6c7a3; --out0:#8f1d1f; --out1:#d03b3b; --out2:#e8908d; --out3:#2a78d6;
  --neg:#d03b3b; --neg2:#e9a3a0; --mid:#f0efec; --pos2:#9ec5f4; --pos:#1c5cab;
  --crit:#d03b3b; --good:#0ca30c; --warnc:#fab219;
  --sans: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --line:#33332f; --grid:#2a2a27;
    --ink:#ffffff; --ink2:#c3c2b7; --ink3:#93928a;
    --s1:#3987e5; --s1-soft:#184f95; --s2:#8a8984; --s3:#d95926; --s4:#199e70; --o-soft:#7a4a33; --out0:#f6b3b0; --out1:#e46b69; --out2:#c33a38; --out3:#3987e5;
    --neg:#e66767; --neg2:#7a3433; --mid:#383835; --pos2:#1c5cab; --pos:#6da7ec;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --line:#33332f; --grid:#2a2a27;
  --ink:#ffffff; --ink2:#c3c2b7; --ink3:#93928a;
  --s1:#3987e5; --s1-soft:#184f95; --s2:#8a8984; --s3:#d95926; --s4:#199e70; --o-soft:#7a4a33; --out0:#f6b3b0; --out1:#e46b69; --out2:#c33a38; --out3:#3987e5;
  --neg:#e66767; --neg2:#7a3433; --mid:#383835; --pos2:#1c5cab; --pos:#6da7ec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:24px 60px;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;margin:0;font-weight:650;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:650}
.sub{color:var(--ink2);font-size:13px;margin:4px 0 0}
.note{color:var(--ink3);font-size:12px;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.filters label{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink2);padding:4px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--s1);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--ink2)}
.tile .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .c{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chart{width:100%;overflow-x:auto}
svg text{font-family:var(--sans);fill:var(--ink2);font-size:11px}
svg .val{fill:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
#tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;z-index:9;max-width:320px;font-variant-numeric:tabular-nums}
#tip b{font-weight:650}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);color:var(--ink2);font-weight:600;cursor:pointer;user-select:none}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
.tbl{max-height:460px;overflow:auto;border:1px solid var(--grid);border-radius:6px}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.bad{color:var(--crit);font-weight:600}
.explain{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--s1);border-radius:6px;padding:10px 14px;font-size:13px;color:var(--ink2)}
.explain b{color:var(--ink)}

.lead{font-size:15px;color:var(--ink2);max-width:90ch;margin:6px 0 0}
.rag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.rag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.r-red{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
.r-amb{color:#b26b00;background:color-mix(in srgb,#fab219 22%,transparent)}
.r-grn{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
:root[data-theme="dark"] .r-amb{color:#fab219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .r-amb{color:#fab219}}
.sec{display:flex;flex-direction:column;gap:6px}
.sec h2{font-size:17px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.howto b{color:var(--ink)}
.bar100{display:inline-block;height:8px;border-radius:4px;background:var(--grid);width:90px;vertical-align:middle;position:relative;overflow:hidden}
.bar100 i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:4px}
.bar100 em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--grid)}
tr.sel td{background:var(--s1-soft)}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer}
.btn:hover{border-color:var(--s1)}
.st{font-size:12px;font-weight:600;white-space:nowrap}
.st-0{color:var(--crit)} .st-1{color:#c2410c} .st-2{color:var(--good)}
.empty{color:var(--ink3);font-size:13px;padding:16px 0}
details.ms{position:relative;display:inline-block}
details.ms>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:5px 28px 5px 10px;background:var(--surface);position:relative;white-space:nowrap}
details.ms>summary::-webkit-details-marker{display:none}
details.ms>summary::after{content:"\25BE";position:absolute;right:10px;top:5px;color:var(--ink3)}
details.ms>summary b{color:var(--ink);font-weight:600}
details.ms[open]>summary{border-color:var(--s1)}
.ms-pop{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:2px}
.ms-pop label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);padding:4px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.ms-pop label:hover{background:var(--grid)}
.ms-act{display:flex;gap:10px;padding:2px 6px 6px;border-bottom:1px solid var(--grid);margin-bottom:4px}
.ms-act button{font:inherit;font-size:12px;border:0;background:none;color:var(--s1);cursor:pointer;padding:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink2);padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--s1);font-weight:600}
.page{display:none;flex-direction:column;gap:14px}
.page.on{display:flex}

/* ===== v5 look ===== */
:root{--hero1:#123a7a;--hero2:#1c6fb8;--hero3:#0f8c8c;--k-blue:#2a78d6;--k-red:#d03b3b;--k-orange:#e0632a;--k-violet:#6b4fd3;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06)}
:root[data-theme="dark"]{--hero1:#0d2a5c;--hero2:#14528c;--hero3:#0b6b6b;--k-blue:#5598e7;--k-red:#e66767;--k-orange:#f0864f;--k-violet:#9a85f0;--shadow:0 1px 2px rgba(0,0,0,.4)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero1:#0d2a5c;--hero2:#14528c;--hero3:#0b6b6b;--k-blue:#5598e7;--k-red:#e66767;--k-orange:#f0864f;--k-violet:#9a85f0;--shadow:0 1px 2px rgba(0,0,0,.4)}}
.wrap{gap:20px}
.hero{background:linear-gradient(120deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);color:#fff;border-radius:16px;padding:22px 24px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.hero h1{color:#fff;font-size:24px}
.hero .lead{color:rgba(255,255,255,.88);margin:0;max-width:95ch}
.hero .scope{color:rgba(255,255,255,.7);font-size:12px;margin:0}
.hero .filters{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px)}
.hero details.ms>summary{background:rgba(255,255,255,.95);border-color:transparent;color:#334}
.hero details.ms>summary b{color:#0b1b33}
.hero .ms-pop{color:var(--ink)}
.tiles{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{border:0;border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.tile .v{font-size:30px;margin-top:4px}
.tile .c{color:var(--ink2)}
.tile.t0 .k,.tile.t0 .v{color:var(--k-blue)} .tile.t1 .k,.tile.t1 .v{color:var(--k-red)}
.tile.t2 .k,.tile.t2 .v{color:var(--k-orange)} .tile.t3 .k,.tile.t3 .v{color:var(--k-violet)}
.tile::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;opacity:.12}
.tile.t0::after{background:var(--k-blue)} .tile.t1::after{background:var(--k-red)} .tile.t2::after{background:var(--k-orange)} .tile.t3::after{background:var(--k-violet)}
.card{border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;box-shadow:var(--shadow);gap:10px}
.card h2{font-size:17px;display:flex;align-items:center;gap:10px}
.card h2 .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12.5px;font-weight:700;color:#fff;flex:none}
.n1{background:var(--k-violet)} .n2{background:var(--k-blue)} .n3{background:var(--k-orange)} .n4{background:var(--k-red)} .n5{background:var(--hero3)}
.callout{display:flex;flex-wrap:wrap;gap:10px}
.callout span{background:var(--grid);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
.callout b{color:var(--k-red)}
.tbl{border-radius:10px}
#tMe tbody tr:nth-child(even) td,#tCust tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--grid) 55%,transparent)}
th{font-size:12px;text-transform:none}
.howto div{border-radius:10px}

.story{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.story h2{font-size:17px;margin:0}
.story ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.story li{border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.45;color:var(--ink);background:color-mix(in srgb,var(--c) 10%,var(--surface));border-top:3px solid var(--c)}
.story li .h{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.story li b{font-variant-numeric:tabular-nums}
.take{font-size:14px;color:var(--ink);margin:0}
.take b{color:var(--k-red)}
.hero .filters{position:relative;z-index:30}

.info{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;font-style:italic;font-family:Georgia,serif;
      color:var(--ink3);border:1.5px solid var(--line);cursor:help;margin-left:2px;flex:none}
.info:hover{color:var(--s1);border-color:var(--s1)}
.hero .info{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.5)}
.tile{cursor:help}
[data-tip]{cursor:help}
tr.click[data-tip]{cursor:pointer}
#tip{max-width:360px;line-height:1.45}
#tip .t-h{font-weight:650;display:block;margin-bottom:2px}
#tip .t-m{color:var(--ink3)}
.legend .rag{cursor:help}
svg text{pointer-events:none}
.qbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.minn{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;cursor:help}
.minn select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px;cursor:pointer}
.minn b{color:var(--ink);font-weight:600}
.flt th{cursor:default;padding:4px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.flt input,.flt select{width:100%;min-width:52px;box-sizing:border-box;font:inherit;font-size:12px;font-weight:400;color:var(--ink);background:var(--bg,var(--surface));border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.flt input.on,.flt select.on{border-color:var(--s1);background:color-mix(in srgb,var(--s1) 8%,var(--surface))}
.flt select[data-f="ten"]{min-width:86px}
.fclear{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:6px;padding:4px 10px;cursor:pointer}
#nQ{display:none!important}
#tMe thead{position:sticky;top:0;z-index:3;background:var(--surface);box-shadow:0 1px 0 var(--line)}
#tMe thead th{position:static;background:var(--surface)}
#tMe .flt th{padding:6px 6px 8px;vertical-align:middle}
#tMe .flt input,#tMe .flt select{height:28px;padding:0 8px;border-radius:6px;font-size:12.5px}
#tMe .flt input::placeholder{color:var(--ink3);opacity:.7;font-style:italic}
#tMe .flt .fclear{height:28px;padding:0 12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <h1 style="display:flex;align-items:center;gap:10px">Mumbai ME ECS Collection Tracker <span class="info" data-tip="<span class=t-h>About this page</span>Hot Data and Online · fresh ECS deals · MEs only.<br>Jul–Dec'25 and Jan–Mar'26: bills tracked 6 months after sale. Apr–Jun'26: 3 months.<br><span class=t-m>Sources: Billed &amp; Clearance Mapping Apr'24–Sep'26, deal-closed data, HR master.</span>">i</span></h1>
    </div>
    <div class="filters" role="group" aria-label="Filters">
      <span id="msP"></span>
      <span id="msTeam"></span>
      <span id="msTen"></span>
    </div>
    <div class="tiles" id="tiles"></div>
  </header>

  <div class="card">
    <h2><span class="num n1">1</span>Who matters most: customers sold vs collection <span class="info" id="iQ">i</span></h2>
    <div class="callout" id="nQ" hidden></div>
    <div class="qbar"><div class="legend" id="lQ"></div><label class="minn" data-tip="<span class=t-h>Show more MEs</span>Lower this to see MEs with fewer customers (e.g. new MEs). Dots under 10 customers are hollow: too few customers to rate them Act now.">Show MEs with at least <select id="fMinN"><option value="1">1</option><option value="3">3</option><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option></select> customers <b id="nMinN"></b></label></div>
    <div class="chart" id="cQ"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2><span class="num n2">2</span>What happened to the customers <span class="info" data-tip="<span class=t-h>What happened to the customers</span>Every customer sold in the selected period, split into: no bill cleared · partly paid, then stopped · still paying. Hover a bar for counts.">i</span></h2>
      <p class="take" id="tk2" hidden></p>
      <p class="note" id="nStatus" hidden></p>
      <div class="legend" id="lStatus"></div>
      <div class="chart" id="cStatus"></div>
    </div>
    <div class="card">
      <h2><span class="num n3">3</span>Collection by ME tenure <span class="info" data-tip="<span class=t-h>Collection by ME tenure</span>₹ collected for every ₹100 expected, grouped by how long the ME had been with us when the deal was closed.<br>Dotted line = what MEs on the same teams collect. Green = above it, red = below. Faded = group not selected in the filter.<br><span class=t-m>Includes MEs who have since left.</span>">i</span></h2>
      <p class="take" id="tk3" hidden></p>
      <div class="chart" id="cTen"></div>
    </div>
  </div>


  <div class="card sec">
    <h2><span class="num n4">4</span><span id="hMe">MEs: who is losing the most money</span> <span class="info" data-tip="<span class=t-h>How MEs are compared</span>Each ME is compared only with MEs who got leads from the same team in the same month, so nobody is penalised for the leads they were given.<br>Hover a row for a plain-language summary. Click it to see that ME's customers.">i</span></h2>
    <div class="legend"><span class="rag r-red" data-tip="<span class=t-h>Act now</span>Collects ₹5 or more less per ₹100 expected than MEs on the same team, on 10+ customers.">Act now</span><span class="rag r-amb" data-tip="<span class=t-h>Watch</span>Collects ₹2–5 less per ₹100 expected than the team, or below it on fewer than 10 customers.">Watch</span><span class="rag r-grn" data-tip="<span class=t-h>OK</span>In line with the team or better.">OK</span></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center"><label for="fSearch" style="font-size:12px;color:var(--ink2)">Search ME <input id="fSearch" type="text" placeholder="name or code"></label><span id="msRag"></span><label style="font-size:12px;color:var(--ink2)"><input id="fActive" type="checkbox" checked> Active MEs only</label></div>
    <div class="tbl" style="max-height:520px"><table id="tMe"></table></div>
  </div>

  <div class="card sec">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2><span class="num n5">5</span><span id="hCust">Customers not paying</span> <span class="info" data-tip="<span class=t-h>Customers not paying</span>Sorted by ₹ pending = monthly bill × months expected − amount collected.<br>Click an ME above to see only their customers. Download gives the full list.<br><span class=t-m>Includes customers of MEs who have since left.</span>">i</span></h2>
      <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span id="msSt"></span>
        <button class="btn" id="bClear" hidden>Show all MEs</button>
        <button class="btn" id="bCsv">Download list (CSV)</button>
      </span>
    </div>
    <div class="tbl" style="max-height:560px"><table id="tCust"></table></div>
  </div>
</div>

function multi(hostId,label,opts,key,onCh,idx){

      opts.map((o,j)=>'<label><input type="checkbox" data-i="'+ids[j]+'"'+(sel.has(ids[j])?' checked':'')+'> '+o+'</label>').join('')+'</div>';
    det.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{ const i=+cb.dataset.i; const cnt=ids.filter(k=>sel.has(k)).length; if(cb.checked) sel.add(i); else if(cnt>1) sel.delete(i); else cb.checked=true; keep(); });

function sum(rows){let due=0,col=0,exp=0,n=0,st=[0,0,0];for(const d of rows){due+=d[F.due];col+=d[F.col];exp+=d[F.exp];n++;st[d[F.st]]++;}return {due,col,exp,n,st,per:due?col/due:0,tper:due?exp/due:0,extra:exp-col};}


function renderStory(){
  const rows=withTen(base()); const a=sum(rows);
  const M=meStats(rows).filter(m=>m.extra>0).sort((x,y)=>y.extra-x.extra); const tot=M.reduce((s,m)=>s+m.extra,0);
  let acc=0,k50=0; for(const m of M){acc+=m.extra;k50++;if(acc>=tot/2)break;}
  const act=meRows().filter(r=>r.rag===0);
  const top=meStats(rows).filter(m=>m.n>=10&&m.rag===0).sort((x,y)=>y.extra-x.extra).slice(0,3);
  const T=tenRows(); const best=T.slice().sort((x,y)=>(y.per-y.tper)-(x.per-x.tper))[0], worst=T.slice().sort((x,y)=>(x.per-x.tper)-(y.per-y.tper))[0];
  const d=x=>Math.round((x.per-x.tper)*100);
  const sg=v=>(v>0?'+':'')+v;
  const below=T.filter(x=>d(x)<=-3).sort((p,q)=>d(p)-d(q)), above=T.filter(x=>d(x)>=3).sort((p,q)=>d(q)-d(p));
  const tenTxt = !T.length ? 'Not enough data.' :
    (below.length ? `${below.map(x=>`<b>${x.label}</b> MEs collect ₹${Math.round(x.per*100)} per ₹100 vs ₹${Math.round(x.tper*100)} for the same teams (<b>${sg(d(x))}</b>)`).join('; ')}.`+(above.length?` ${above.map(x=>`${x.label} are above (${sg(d(x))})`).join(', ')}.`:'')
     : `No tenure group is below the team average${above.length?`; ${above.map(x=>`<b>${x.label}</b> are above (${sg(d(x))})`).join(', ')}`:''}. <b>Tenure is not what drives the loss</b>; individual MEs are.`);
  const items=[
    ['What happened','--k-blue',`Of <b>${a.n.toLocaleString('en-IN')}</b> customers sold, <b>${a.st[0].toLocaleString('en-IN')}</b> had no bill cleared and <b>${a.st[1].toLocaleString('en-IN')}</b> partly paid, then stopped. Only <b>₹${Math.round(a.per*100)}</b> of every ₹100 expected came in, so <b>${crore(a.due-a.col)}</b> is not collected.`],
    ['How concentrated','--k-violet',M.length?`Compared fairly with MEs on the same team, just <b>${k50} MEs</b> cause half of the extra loss (${lakh(tot)}). <b>${act.length} MEs</b> need action now.`:'No ME is below the team on this selection.'],
    ['Who','--k-red',top.length?`Biggest impact: ${top.map(m=>`<b>${m.name}</b> (₹${Math.round(m.per*100)} vs ₹${Math.round(m.tper*100)})`).join(', ')}. They sell a lot but collect well below the team.`:'No ME in the action zone.'],
    ['Tenure','--k-orange',tenTxt],
    ['What to do','--hero3',`Review the <b>Act now</b> MEs below with their managers, and call the customers in the not-paying list, starting with the highest ₹ pending. Use <b>Download list</b> to share it.`]
  ];
  $('#story').innerHTML=items.map(([h,c,txt])=>`<li style="--c:var(${c})"><span class="h">${h}</span>${txt}</li>`).join('');
  $('#tk2').innerHTML=`About <b>${Math.round(a.st[0]/a.n*100)}%</b> had no bill cleared and <b>${Math.round(a.st[1]/a.n*100)}%</b> partly paid, then stopped.`;
  $('#tk3').innerHTML=below.length?`Below the team: ${below.map(x=>`<b>${x.label}</b> (${sg(d(x))} per ₹100)`).join(', ')}.`:`No tenure group is below the team average${above.length?'; '+above.map(x=>`${x.label} slightly above (${sg(d(x))})`).join(', '):''}.`;
}

const esc=s=>String(s).replace(/"/g,'&quot;');

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monAfter=(ym,j)=>{const y=Math.floor(ym/100),m=ym%100-1+j;return MON[((m%12)+12)%12]+"'"+String(y+Math.floor(m/12)).slice(2);};
const lastPaid=d=>{const p=d[F.pf]||'';let lp=0;for(let j=1;j<=d[F.k];j++) if(p[j-1]==='1') lp=j;return lp;};
const ticks=d=>{const p=d[F.pf]||'';let s='';for(let j=1;j<=d[F.k];j++) s+=`<span style="display:inline-block;min-width:44px">${p[j-1]==='1'?'✓':'✗'} ${monAfter(d[F.ym],j)}</span>`;return s;};
function stopText(d){const k=d[F.k],ym=d[F.ym],lp=lastPaid(d);
  if(d[F.st]===0) return `No bill cleared in month 1–${k} after the sale (${monAfter(ym,1)} to ${monAfter(ym,k)}).`;
  if(d[F.st]===1) return `Last bill cleared: <b>month ${lp} (${monAfter(ym,lp)})</b>.<br>Stopped from <b>month ${lp+1} (${monAfter(ym,lp+1)})</b>; nothing cleared up to month ${k} (${monAfter(ym,k)}).`;
  return `Bill cleared in month ${k} (${monAfter(ym,k)}), the last month tracked.`;}
function stopMix(rows){const P=[...new Set(rows.map(d=>d[F.period]))].sort(); if(!P.length) return '';
  const one=rs=>{const c={};let n=0;for(const d of rs) if(d[F.st]===1){const lp=lastPaid(d);c[lp]=(c[lp]||0)+1;n++;} return [c,n];};
  if(P.length===1){const [c,n]=one(rows); if(!n) return ''; return '<br><br><b>Stopped after:</b><br>'+Object.keys(c).sort((a,b)=>a-b).map(j=>`month ${j}: ${c[j].toLocaleString('en-IN')} (${Math.round(c[j]/n*100)}%)`).join('<br>');}
  return '<br><br><b>Stopped after:</b>'+P.map(p=>{const [c,n]=one(rows.filter(d=>d[F.period]===p)); if(!n) return ''; return `<br><b>${D.periods[p]}</b> (of ${D.months[D.periods[p]]} months): `+Object.keys(c).sort((a,b)=>a-b).map(j=>`m${j} ${c[j].toLocaleString('en-IN')}`).join(' · ');}).join('');}
function kGroups(){const g={};[...S.per].sort().forEach(i=>{const p=D.periods[i],k=D.months[p];(g[k]=g[k]||[]).push(p);});return Object.keys(g).sort((a,b)=>b-a).map(k=>[+k,g[k]]);}
function kText(range){const G=kGroups(); const f=k=>range?`months 1–${k}`:`month ${k}`;
  return G.length===1?`${f(G[0][0])} after the sale`:G.map(([k,ps])=>`${f(k)} for ${ps.join(' & ')} sales`).join('; ');}
function stopDef(){return `Paid at least one bill, then stopped: no bill cleared from the month they stopped up to the last month tracked (${kText(false)}).`;}
function payDef(){return `Bill cleared in the last month tracked (${kText(false)}).`;}
function noneDef(){return `Not a single monthly bill cleared in ${kText(true)}.`;}
const TILETIP=[
  a=>`<span class=t-h>Customers sold</span>Fresh ECS customers closed by MEs on Hot Data and Online leads in ${perLabel()}.`,
  a=>`<span class=t-h>No bill cleared</span>${noneDef()}<br>${a.st[0].toLocaleString('en-IN')} of ${a.n.toLocaleString('en-IN')} customers.`,

  a=>`<span class=t-h>Money not collected</span>Expected so far ${crore(a.due)} − collected ${crore(a.col)} (late payments counted).<br>₹${Math.round(a.per*100)} of every ₹100 expected came in.`];
function renderTiles(){

  $('#tiles').innerHTML=[

    ['No bill cleared',a.st[0].toLocaleString('en-IN'),`${pct(a.st[0]/a.n)} of customers`],

  const W=560,rowH=40,L=80,R=16,H=groups.length*rowH+26; const s=svg($('#cStatus'),W,H); const x=v=>L+(W-L-R)*v;
  [0,.25,.5,.75,1].forEach(g=>{el('line',{x1:x(g),x2:x(g),y1:4,y2:H-20,stroke:css('--grid')},s);el('text',{x:x(g),y:H-4,'text-anchor':'middle'},s).textContent=Math.round(g*100)+'%';});

      r.onmousemove=ev=>showTip(ev,`<span class=t-h>${g.label} · ${D.status[j]}</span>${v.toLocaleString('en-IN')} of ${a.n.toLocaleString('en-IN')} customers (${pct(w)})<br><span class=t-m>${[noneDef(),stopDef()+stopMix(g.r),payDef()][j]}</span>`);r.onmouseleave=hideTip;acc+=w;});});

function tenRows(){
  const rows=base(); return D.tenure.map((t,i)=>{const r=rows.filter(d=>d[F.ten]===i);const a=sum(r);a.label=t;a.mes=new Set(r.map(d=>d[F.me])).size;return a;}).filter(a=>a.n>0&&a.label!=='Unknown');
}
function renderTen(){
  const T=tenRows(); const W=560,H=250,L=40,R=16,Tp=20,B=40; const s=svg($('#cTen'),W,H);
  const hi=Math.min(100,Math.ceil(Math.max(...T.map(t=>Math.max(t.per,t.tper)))*10)*10+10), lo=Math.max(0,Math.floor(Math.min(...T.map(t=>Math.min(t.per,t.tper)))*10)*10-10);
  const bw=(W-L-R)/T.length, y=v=>Tp+(H-Tp-B)*(1-(v*100-lo)/(hi-lo));
  for(let g=lo;g<=hi;g+=10){el('line',{x1:L,x2:W-R,y1:y(g/100),y2:y(g/100),stroke:css('--grid')},s);el('text',{x:L-6,y:y(g/100)+4,'text-anchor':'end'},s).textContent='₹'+g;}
  const pts=[];
  T.forEach((t,i)=>{const cx=L+bw*i+bw/2; const top=y(t.per);
    const rect=el('rect',{x:cx-bw*0.28,y:top,width:bw*0.56,height:Math.max(1,y(lo/100)-top),rx:6,fill:(t.per-t.tper>=0.02?css('--good'):(t.per-t.tper<=-0.02?css('--crit'):css('--s1'))),'fill-opacity':S.tens.has(D.tenure.indexOf(t.label))?0.9:0.25},s);

    pts.push(`${cx},${y(t.tper)}`);
    rect.onmousemove=ev=>showTip(ev,`<span class=t-h>${Math.round((t.per-t.tper)*100)>=2?'▲ Above':Math.round((t.per-t.tper)*100)<=-2?'▼ Below':'≈ In line with'} the team · ${t.label}</span><br>${t.mes} MEs · ${t.n.toLocaleString('en-IN')} customers<br>Collected ₹${Math.round(t.per*100)} per ₹100 expected (same teams: ₹${Math.round(t.tper*100)})<br>No bill cleared ${pct(t.st[0]/t.n)} · partly paid, then stopped ${pct(t.st[1]/t.n)}<br>Extra lost vs same teams: ${lakh(Math.max(0,t.extra))}`);rect.onmouseleave=hideTip;});

function meRows(){
  const by={}; for(const d of withTen(base())) if(activeOk(d[F.me])) (by[d[F.me]]=by[d[F.me]]||[]).push(d);
  return Object.entries(by).map(([e,r])=>{const a=sum(r);const p=D.people[e];const gap=a.per-a.tper;const adj=gap*a.n/(a.n+10);
    const rag=(adj<=-0.05&&a.n>=10)?0:(adj<=-0.02?1:2); const ten=r.map(d=>d[F.tenm]).filter(v=>v!=null).sort((x,y)=>x-y);
    return {e:+e,code:p[0],name:p[1],n:a.n,never:a.st[0],missed:a.st[1],per:a.per,tper:a.tper,gap,adj,rag,extra:a.extra,notcol:a.due-a.col,ten:ten.length?ten[Math.floor(ten.length/2)]:null};});
}
const RAG=[['Act now','r-red'],['Watch','r-amb'],['OK','r-grn']];
const tenTxt=m=>m==null?'–':(m<12?Math.round(m)+' m':(m/12).toFixed(1)+' yrs');

S.cf={};
const TENF=[['','All'],['0-3','0–3 m'],['3-6','3–6 m'],['6-12','6–12 m'],['12-24','1–2 yrs'],['24-9999','2+ yrs']];
function parseF(s){s=String(s||'').trim().replace(/[₹,\s]/g,'').toLowerCase().replace(/l$/,''); if(!s) return null; let m;
  if(m=s.match(/^(>=|<=|>|<|=)?(-?\d*\.?\d+)$/)){const v=+m[2],o=m[1]||'>=';return x=>o==='>'?x>v:o==='<'?x<v:o==='<='?x<=v:o==='='?Math.abs(x-v)<1e-9:x>=v;}
  if(m=s.match(/^(-?\d*\.?\d+)-(-?\d*\.?\d+)$/)){const a=+m[1],b=+m[2];return x=>x>=a&&x<=b;}
  return null;}
const FVAL={n:r=>r.n,never:r=>r.never,missed:r=>r.missed,per:r=>Math.round(r.per*100),extra:r=>r.extra/1e5,notcol:r=>r.notcol/1e5};
function applyCF(rows){
  const q=(S.cf.name||'').toLowerCase().trim(); if(q) rows=rows.filter(r=>(r.name+' '+r.code).toLowerCase().includes(q));
  if(S.cf.ten){const [a,b]=S.cf.ten.split('-').map(Number); rows=rows.filter(r=>r.ten!=null&&r.ten>=a&&r.ten<b);}
  for(const k in FVAL){const f=parseF(S.cf[k]); if(f) rows=rows.filter(r=>f(FVAL[k](r)));}
  return rows;}
const FPH={n:'Any',never:'Any',missed:'Any',per:'Any',extra:'Any (₹ L)',notcol:'Any (₹ L)'};
const FTIP={n:'customers',never:'customers',missed:'customers',per:'₹ per ₹100 expected',extra:'₹ lakh (e.g. 0.5 = ₹50,000)',notcol:'₹ lakh (e.g. 2 = ₹2 L)'};
function fltRow(cols){return '<tr class="flt">'+cols.map(([c])=>{
  if(c==='rag') return '<th><button class="fclear" id="bCF" type="button">Clear</button></th>';

  if(c==='ten') return `<th><select data-f="ten" class="${S.cf.ten?'on':''}">${TENF.map(([v,l])=>`<option value="${v}"${(S.cf.ten||'')===v?' selected':''}>${l}</option>`).join('')}</select></th>`;
  return `<th data-tip="${esc(`<span class=t-h>Filter: ${FTIP[c]}</span>Type a number for <b>at least</b> that value, or use &gt;, &lt;, = or a range like 10-20.`)}"><input data-f="${c}" inputmode="decimal" placeholder="${FPH[c]}" value="${esc(S.cf[c]||'')}" class="${parseF(S.cf[c])?'on':''}"></th>`;}).join('')+'</tr>';}
function renderMe(){

  $('#tMe').innerHTML='<thead><tr>'+cols.map(([c,t])=>`<th data-k="${c}" scope="col"${HT[c]?` data-tip="${esc('<span class=t-h>'+t+'</span>'+HT[c])}"`:''}>${t}${S.sort===c?(S.dir<0?' ▾':' ▴'):''}</th>`).join('')+'</tr>'+fltRow(cols)+'</thead><tbody>'+
    rows.map(r=>`<tr class="click${r.e===S.me?' sel':''}" data-e="${r.e}" data-tip="${esc(`<span class=t-h>${r.name} · ${RAG[r.rag][0]}</span>Sold ${r.n} customers: ${r.never} with no bill cleared, ${r.missed} partly paid, then stopped.<br>Collects ₹${Math.round(r.per*100)} of every ₹100 expected vs ₹${Math.round(r.tper*100)} for the same team.<br>${r.extra>0?'Extra lost vs a typical ME: '+lakh(r.extra):'No extra loss vs the team.'}<br><span class=t-m>Click to see this ME\'s customers</span>`)}"><td><span class="rag ${RAG[r.rag][1]}">${RAG[r.rag][0]}</span></td><td>${r.name} <span style="color:var(--ink3)">${r.code}</span></td><td>${tenTxt(r.ten)}</td><td>${r.n}</td><td>${r.never}</td><td>${r.missed}</td>`+
      `<td><span class="bar100" title="team ₹${Math.round(r.tper*100)}"><i style="width:${Math.min(100,r.per*100)}%"></i><em style="left:${Math.min(100,r.tper*100)}%"></em></span> ₹${Math.round(r.per*100)} <span style="color:var(--ink3)">vs ₹${Math.round(r.tper*100)}</span></td>`+
      `<td>${r.extra>0?lakh(r.extra):'–'}</td><td>${lakh(r.notcol)}</td></tr>`).join('')+'</tbody>';
  
  document.querySelectorAll('#tMe .flt input').forEach(i=>i.oninput=()=>{S.cf[i.dataset.f]=i.value;renderMe();});

  $('#bCF').onclick=e=>{e.stopPropagation();S.cf={};renderMe();};
  if(!rows.length) $('#tMe tbody').innerHTML=`<tr><td colspan="${cols.length}" class="empty">No MEs match these filters.</td></tr>`;
  if(_af){const el2=document.querySelector(`#tMe [data-f="${_af}"]`); if(el2){el2.focus(); if(_pos!=null&&el2.setSelectionRange) el2.setSelectionRange(_pos,_pos);}}
  document.querySelectorAll('#tMe tr:first-child th').forEach(th=>th.onclick=()=>{const kk=th.dataset.k;S.dir=S.sort===kk?-S.dir:(kk==='rag'?1:-1);S.sort=kk;renderMe();});
  document.querySelectorAll('#tMe tr.click').forEach(tr=>tr.onclick=()=>{S.me=+tr.dataset.e;renderMe();renderCust();$('#hCust').scrollIntoView({behavior:'smooth',block:'start'});});
}

    .map(d=>({company:d[F.company]||'(name not found)',docid:d[F.docid],me:D.people[d[F.me]][1],mecode:D.people[d[F.me]][0],team:D.teams[d[F.team]],date:d[F.date],
      bill:d[F.mbill],paid:d[F.mpaid],k:d[F.k],status:D.status[d[F.st]],st:d[F.st],pending:d[F.due]-d[F.col],stop:stopText(d),ticks:ticks(d),lp:lastPaid(d),lpm:lastPaid(d)?monAfter(d[F.ym],lastPaid(d)):''}))
    .sort((a,b)=>b.pending-a.pending);

function renderCust(){
  const rows=custRows(); $('#bClear').hidden=S.me==null;
  $('#hCust').textContent='Customers not paying'+(S.me!=null?` · ${D.people[S.me][1]}`:'');
  const show=rows.slice(0,500);
  $('#tCust').innerHTML='<thead><tr><th>Customer</th><th>Contract</th><th>ME</th><th>Team</th><th>Sale date</th><th>Monthly bill</th><th data-tip="Months with a bill collected, out of the months expected so far.">Months paid</th><th>Status</th><th data-tip="Monthly bill × months expected − amount collected.">₹ pending</th></tr></thead><tbody>'+
    show.map(r=>`<tr data-tip="${esc(`<span class=t-h>${r.company}</span>Sold by ${r.me} (${r.team}) on ${r.date}.<br>Paid ${r.paid} of ${r.k} monthly bills of ${inr(r.bill)} · <b>${inr(r.pending)}</b> pending.<br><br><b>${r.status}</b><br>${r.stop}<br><span class=t-m>${r.ticks}</span>`)}"><td>${r.company}</td><td style="color:var(--ink3)">${r.docid}</td><td>${r.me}</td><td>${r.team}</td><td>${r.date}</td><td>${inr(r.bill)}</td><td>${r.paid} of ${r.k}</td><td><span class="st st-${r.st}">${r.status}</span>${r.st===1?`<span style="color:var(--ink3);font-size:11.5px"> · after ${r.lpm}</span>`:''}</td><td>${inr(r.pending)}</td></tr>`).join('')+'</tbody>';
  if(!rows.length) $('#tCust').innerHTML='<tbody><tr><td class="empty">No customers match.</td></tr></tbody>';
  else if(rows.length>500) $('#tCust').insertAdjacentHTML('beforeend',`<tbody><tr><td colspan="9" class="empty">Showing the 500 largest. Download the CSV for all ${rows.length.toLocaleString('en-IN')}.</td></tr></tbody>`);
}
function downloadCsv(){
  const rows=custRows(); const head=['Customer','Contract','ME','ME code','Team','Sale date','Monthly bill','Months paid','Months expected','Status','Last bill cleared','Rs pending'];
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv=[head.join(',')].concat(rows.map(r=>[r.company,r.docid,r.me,r.mecode,r.team,r.date,Math.round(r.bill),r.paid,r.k,r.status,r.lpm,Math.round(r.pending)].map(q).join(','))).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));
  a.download=`Mumbai_customers_not_paying_${perLabel().replace(/[^A-Za-z0-9]+/g,'_')}${S.me!=null?'_'+D.people[S.me][0]:''}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

document.addEventListener('change',e=>{if(e.target.id==='fMinN') chartQuadrant();});
function render(){
  renderTiles(); renderStatus(); renderTen(); chartQuadrant(); renderMe(); renderCust();
}
// ================= CHARTS TAB =================
const RAGC=['--crit','--warnc','--good'];
function meStats(rows){
  const by={}; for(const d of rows) if(activeOk(d[F.me])) (by[d[F.me]]=by[d[F.me]]||[]).push(d);
  return Object.entries(by).map(([e,r])=>{const a=sum(r);const gap=a.per-a.tper;const adj=gap*a.n/(a.n+10);
    const ten=r.map(d=>d[F.tenm]).filter(v=>v!=null).sort((x,y)=>x-y);
    return {e:+e,name:D.people[e][1],code:D.people[e][0],status:D.people[e][2],n:a.n,per:a.per,tper:a.tper,gap,adj,extra:a.extra,never:a.st[0],
      rag:(adj<=-0.05&&a.n>=10)?0:(adj<=-0.02?1:2),ten:ten.length?ten[Math.floor(ten.length/2)]:null};});
}
function axisY(s,y,lo,hi,step,L,W,R,fmt){for(let g=lo;g<=hi+1e-9;g+=step){el('line',{x1:L,x2:W-R,y1:y(g),y2:y(g),stroke:Math.abs(g)<1e-9?css('--ink3'):css('--grid')},s);el('text',{x:L-6,y:y(g)+4,'text-anchor':'end'},s).textContent=fmt(g);}}
function goToMe(e){S.me=e;renderMe();renderCust();$('#hCust').scrollIntoView({behavior:'smooth',block:'start'});}

function chartQuadrant(){
  const minN=+($('#fMinN')?.value||10); const M=meStats(withTen(base())).filter(m=>m.n>=minN); $('#nMinN').textContent=`· ${M.length} MEs`;
  $('#lQ').innerHTML=RAG.map((r,i)=>`<span><i style="background:${css(RAGC[i])};border-radius:50%"></i>${r[0]}</span>`).join('')+'<span>Dot size = ₹ lost (red/amber) or extra ₹ collected (green) vs the team</span>';
  { const all=meStats(withTen(base())).filter(m=>m.extra>0).sort((a,b)=>b.extra-a.extra); const tot=all.reduce((s,m)=>s+m.extra,0); let acc=0,k50=0; for(const m of all){acc+=m.extra;k50++;if(acc>=tot/2)break;}
    const rowsP=i=>D.deals.filter(d=>d[F.period]===i&&S.teams.has(d[F.team])&&S.tens.has(d[F.ten]));
    const cnt={}; D.periods.forEach((_,i)=>meStats(rowsP(i)).filter(m=>m.n>=8&&m.gap<-0.02).forEach(m=>cnt[m.e]=(cnt[m.e]||0)+1));
    const both=Object.values(cnt).filter(v=>v>=2).length;
    $('#iQ').dataset.tip=`<span class=t-h>Who matters most</span>Each dot is an ME with ${minN}+ customers (change it with the selector on the right). Right = sold more. Lower = collects less per ₹100 expected than MEs on the same team. Bigger dot = bigger ₹ difference from the team: money lost if below the line, extra money collected if above it. Red zone = sells a lot but collects poorly. Click a dot to see that ME's customers.`;
    $('#nQ').innerHTML=all.length?`<span><b>${k50} MEs</b> cause half of the extra money lost (${lakh(tot)})</span><span><b>${both} MEs</b> below their team in both periods: a pattern, not a bad patch</span>`:''; }
  const W=1180,H=500,L=74,R=24,T=24,B=40; const s=svg($('#cQ'),W,H); if(!M.length) return;
  let xmax=Math.max(20,Math.ceil(Math.max(...M.map(m=>m.n))/20)*20), lo=Math.max(-1,Math.min(-0.35,Math.floor(Math.min(...M.map(m=>m.gap))/0.1)*0.1)), hi=Math.min(1,Math.max(0.25,Math.ceil(Math.max(...M.map(m=>m.gap))/0.1)*0.1));
  const step=(hi-lo)>0.8?0.1:0.05; if(step===0.1) lo=Math.floor(lo*10+1e-9)/10;
  const x=v=>L+(W-L-R)*v/xmax, y=v=>T+(H-T-B)*(1-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo));
  const M10=M.filter(m=>m.n>=10).length?M.filter(m=>m.n>=10):M; const medN=[...M10.map(m=>m.n)].sort((a,b)=>a-b)[Math.floor(M10.length/2)];
  el('rect',{x:L,y:T,width:W-L-R,height:y(0)-T,fill:css('--good'),opacity:0.06},s);
  el('rect',{x:x(medN),y:y(0),width:x(xmax)-x(medN),height:y(lo)-y(0),fill:css('--crit'),opacity:0.10},s);
  axisY(s,y,lo,hi,step,L,W,R,g=>(g>0?'+':'')+'₹'+Math.round(g*100));
  for(let g=0;g<=xmax;g+=20){el('text',{x:x(g),y:H-20,'text-anchor':'middle'},s).textContent=g;}
  el('text',{x:(L+W-R)/2,y:H-4,'text-anchor':'middle'},s).textContent='Customers sold';
  el('text',{x:14,y:(T+H-B)/2,'text-anchor':'middle',transform:`rotate(-90 14 ${(T+H-B)/2})`},s).textContent='₹ collected per ₹100 expected, vs same team';
  el('line',{x1:x(medN),x2:x(medN),y1:T,y2:H-B,stroke:css('--ink3'),'stroke-dasharray':'3 3'},s);
  el('text',{x:x(medN)+4,y:T+10},s).textContent=`median ${medN}`;
  const q=[['Sells a lot, collects well',W-R-8,T+14,'end'],['Sells a lot, collects poorly → biggest impact',W-R-8,H-B-8,'end'],['Sells less, collects well',L+8,T+14,'start'],['Sells less, collects poorly',L+8,H-B-8,'start']];
  q.forEach(([t,xx,yy,a])=>{const tx=el('text',{x:xx,y:yy,'text-anchor':a},s);tx.textContent=t;tx.style.fill=css('--ink3');});
  el('text',{x:L+4,y:y(0)-5},s).textContent='same as team';
  const rmax=Math.max(...M.map(m=>Math.abs(m.extra)))||1;
  M.sort((a,b)=>Math.abs(b.extra)-Math.abs(a.extra));
  const placed=[]; const labelled=new Set(); for(const m of [...M.filter(m=>m.rag===0).slice(0,10),...M.filter(m=>m.extra<0&&m.n>=10).sort((a,b)=>a.extra-b.extra).slice(0,5)]){const px=x(m.n),py=y(m.gap); if(placed.every(([a,b])=>Math.abs(a-px)>70||Math.abs(b-py)>14)){placed.push([px,py]);labelled.add(m.e);}}
  M.slice().reverse().forEach(m=>{const r=4+14*Math.sqrt(Math.abs(m.extra)/rmax);
    const small=m.n<10; const c=el('circle',{cx:x(m.n),cy:y(m.gap),r,fill:css(RAGC[m.rag]),'fill-opacity':small?0.12:0.75,stroke:small?css(RAGC[m.rag]):css('--surface'),'stroke-width':1.5},s); c.style.cursor='pointer';
    c.onmousemove=ev=>{const g=Math.round(m.per*100)-Math.round(m.tper*100); const zone=(m.n>=medN?'Sells a lot':'Sells less')+', '+(m.gap<0?'collects below the team':'collects at or above the team'); showTip(ev,`<span class=t-h>${m.name} · ${RAG[m.rag][0]}</span>Sold <b>${m.n}</b> customers; <b>${m.never}</b> with no bill cleared.<br>Collects <b>₹${Math.round(m.per*100)}</b> of every ₹100 expected; MEs on the same team collect ₹${Math.round(m.tper*100)} (${g>0?'+':''}${g}).<br>${m.extra>0?`Extra money lost vs a typical ME: <b>${lakh(m.extra)}</b>`:`Extra money collected vs a typical ME: <b>${lakh(-m.extra)}</b>`}<br><span class=t-m>${zone} · click to see customers</span>`);};
    c.onmouseleave=hideTip; c.onclick=()=>goToMe(m.e);
    if(labelled.has(m.e)) el('text',{x:x(m.n)+r+3,y:y(m.gap)+4,class:'val',style:'font-size:10.5px'},s).textContent=m.name.split(' ').slice(0,2).join(' ');});
}



render();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
</script>
